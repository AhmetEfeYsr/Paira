<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

    <title>ÇizBil | Oyun Odası</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/shared.css">

</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <main id="app-container" class="glass-panel custom-scrollbar">

        <header class="app-header">
            <h1 class="gradient-text">ÇizBil</h1>
            <button id="btn-leave" class="btn btn-secondary btn-sm">Çıkış</button>
        </header>

        <!-- LOBİ EKRANI -->
        <section id="lobby-screen" class="view-state active">
            <header class="lobby-header">
                <div class="code-container">
                    <h2 >Oda Kodu:</h2>
                    <span id="display-room-code" data-code="" >••••••••</span>
                    <button id="btn-toggle-code" class="toggle-btn" title="Göster/Gizle">👁️</button>
                </div>
                <button id="btn-copy-room" class="btn btn-secondary">Kopyala</button>
            </header>

            <div class="lobby-grid">
                <!-- Sol Panel: Oyuncular -->
                <aside class="players-panel card">
                    <h3 >Oyuncular (<span id="player-count">0</span>)</h3>
                    <ul id="players-list" class="custom-scrollbar"></ul>
                </aside>

                <!-- Sağ Panel: Kurucu Ayarları -->
                <section class="settings-panel card custom-scrollbar" id="host-settings">
                    <h3 >Oyun Ayarları</h3>
                    <div class="settings-grid">
                        <div class="form-group"><label>Tur Süresi (Sn)</label><input type="number" id="turn-duration" value="60" min="30" max="180"></div>
                        <div class="form-group"><label>Hedef Puan</label><input type="number" id="target-score" value="50" min="10" max="200"></div>
                    </div>

                    <button id="btn-start-game" class="btn btn-primary btn-block mt-auto">Oyunu Başlat (Min 2 Kişi)</button>
                </section>

                <!-- Katılımcı Bekleme Paneli -->
                <section class="settings-panel card hidden" id="client-waiting">
                    <div >⏳</div>
                    <h3>Bekleniyor...</h3>
                    <p >Kurucu oyunu başlatacak.</p>
                </section>
            </div>
        </section>

        <!-- OYUN EKRANI -->
        <section id="game-screen" class="view-state hidden">
            <header class="game-topbar card">
                <div >
                    <div id="game-status-message" >Hazırlanıyor...</div>
                    <div >Çizen: <span id="current-drawer" >...</span></div>
                </div>

                <div class="word-display" id="main-word">***</div>

                <!-- Süre -->
                <div class="timer-wrapper">
                    <div id="timer-display" class="timer">00:00</div>
                </div>
            </header>

            <div class="cizbil-layout">
                <div class="game-area">
                    <div class="canvas-container">
                        <canvas id="drawing-board" width="800" height="450" ></canvas>
                        <!-- Canvas overlay for guessers indicating they can't draw -->
                        <div id="canvas-overlay" ></div>
                    </div>

                    <!-- Only visible to drawer -->
                    <div class="toolbar card" id="toolbar">
                        <div class="color-picker" id="color-picker">
                            <div class="color-swatch active" data-color="#000000"></div>
                            <div class="color-swatch" data-color="#e74c3c"></div>
                            <div class="color-swatch" data-color="#3498db"></div>
                            <div class="color-swatch" data-color="#2ecc71"></div>
                            <div class="color-swatch" data-color="#f1c40f"></div>
                            <div class="color-swatch" data-color="#ffffff"></div> <!-- Eraser -->
                        </div>

                        <div class="size-picker" id="size-picker">
                            <div class="size-btn" data-size="3"><div ></div></div>
                            <div class="size-btn active" data-size="8"><div ></div></div>
                            <div class="size-btn" data-size="15"><div ></div></div>
                            <div class="size-btn" data-size="25"><div ></div></div>
                        </div>

                        <div class="tools">
                            <button class="btn btn-secondary btn-sm" id="btn-clear">Temizle</button>
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="chat-panel card">
                        <div >Tahminler</div>
                        <div class="messages-container custom-scrollbar" id="messages-container"></div>
                        <div class="chat-input-wrapper">
                            <input type="text" id="chat-input" class="game-input" placeholder="Tahmin yaz..." autocomplete="off">
                            <button id="btn-send-chat" class="btn btn-primary">Gönder</button>
                        </div>
                    </div>

                    <div class="leaderboard card">
                        <div >Skorlar</div>
                        <ul class="leaderboard-list custom-scrollbar" id="game-scores-list"></ul>
                    </div>
                </div>
            </div>
        </section>

        <!-- BİTİŞ EKRANI -->
        <section id="winner-screen" class="view-state hidden">
            <h1 class="gradient-text">Oyun Bitti!</h1>
            <div class="card">
                <h2 >Sıralama Tablosu</h2>

                <div id="final-scores" class="custom-scrollbar">
                    <!-- Skorlar buraya basılacak -->
                </div>

                <button id="btn-back-to-lobby" class="btn btn-primary btn-block">Lobiye Dön</button>
            </div>
        </section>
    </main>

    <script src="../shared/shared.js"></script>
    <script src="../shared/cizbil_words.js"></script>
    <script src="network.js" type="module"></script>
    <script src="game.js" type="module"></script>

<script>
        (function() {
            const savedTheme = localStorage.getItem('paira_theme') || 'paira';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</body>
</html>
