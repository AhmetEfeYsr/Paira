<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

    <title>ÇizBil | Oyun Odası</title>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="../shared/shared.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <main id="app-container" class="glass-panel custom-scrollbar">

        <header class="app-header" style="position: relative;">
            <h1 class="gradient-text" style="font-size: 2rem;">ÇizBil</h1>
            <button id="btn-leave" class="btn btn-secondary btn-sm" style="position: absolute; right: 0; top: 0;">Çıkış</button>
        </header>

        <!-- LOBİ EKRANI -->
        <section id="lobby-screen" class="view-state active">
            <header class="lobby-header">
                <div class="code-container">
                    <h2 style="margin:0; font-size: 1.15rem; color: var(--text-muted);">Oda Kodu:</h2>
                    <span id="display-room-code" data-code="" style="color: var(--neon-purple); letter-spacing: 2px; font-family: monospace; font-size: 1.4rem; user-select: none;">••••••••</span>
                    <button id="btn-toggle-code" class="toggle-btn" title="Göster/Gizle">👁️</button>
                </div>
                <button id="btn-copy-room" class="btn btn-secondary">Kopyala</button>
            </header>

            <div class="lobby-grid">
                <!-- Sol Panel: Oyuncular -->
                <aside class="players-panel card">
                    <h3 style="border-bottom: 1px solid var(--btn-secondary-bg); padding-bottom: 12px;">Oyuncular (<span id="player-count">0</span>)</h3>
                    <ul id="players-list" class="custom-scrollbar"></ul>
                </aside>

                <!-- Sağ Panel: Kurucu Ayarları -->
                <section class="settings-panel card custom-scrollbar" id="host-settings" style="display: none; overflow-y: auto;">
                    <h3 style="border-bottom: 1px solid var(--btn-secondary-bg); padding-bottom: 12px;">Oyun Ayarları</h3>
                    <div class="settings-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 15px; margin-bottom: 1rem;">
                        <div class="form-group" style="margin-bottom: 0;"><label>Tur Süresi (Sn)</label><input type="number" id="turn-duration" value="60" min="30" max="180"></div>
                        <div class="form-group" style="margin-bottom: 0;"><label>Hedef Puan</label><input type="number" id="target-score" value="50" min="10" max="200"></div>
                    </div>

                    <button id="btn-start-game" class="btn btn-primary btn-block mt-auto" style="padding: 16px; font-size: 1.15rem; margin-top: 15px; letter-spacing: 1px;">Oyunu Başlat (Min 2 Kişi)</button>
                </section>

                <!-- Katılımcı Bekleme Paneli -->
                <section class="settings-panel card hidden" id="client-waiting" style="justify-content: center; align-items: center; text-align: center;">
                    <div style="color: var(--primary-purple); font-size: 3rem; margin-bottom: 1rem;">⏳</div>
                    <h3>Bekleniyor...</h3>
                    <p style="color: var(--text-muted); font-size: 1.05rem;">Kurucu oyunu başlatacak.</p>
                </section>
            </div>
        </section>

        <!-- OYUN EKRANI -->
        <section id="game-screen" class="view-state hidden">
            <header class="game-topbar card">
                <div style="display:flex; flex-direction:column; gap:5px; text-align:left;">
                    <div id="game-status-message" style="font-weight: bold; color: var(--primary);">Hazırlanıyor...</div>
                    <div style="font-size: 0.9rem; color: var(--text-muted);">Çizen: <span id="current-drawer" style="color:var(--warning); font-weight:bold;">...</span></div>
                </div>

                <div class="word-display" id="main-word" style="font-size: 1.5rem; font-weight: bold; letter-spacing: 2px;">***</div>

                <!-- Süre -->
                <div class="timer-wrapper" style="display: flex; align-items: center; justify-content: center;">
                    <div id="timer-display" class="timer" style="font-size: 2rem; font-weight: bold; color: var(--warning);">00:00</div>
                </div>
            </header>

            <div class="cizbil-layout">
                <div class="game-area">
                    <div class="canvas-container">
                        <canvas id="drawing-board" width="800" height="450"></canvas>
                        <!-- Canvas overlay for guessers indicating they can't draw -->
                        <div id="canvas-overlay" style="position:absolute; top:0; left:0; right:0; bottom:0; z-index:10; pointer-events:all; cursor:not-allowed;"></div>
                        <!-- Word choice overlay for drawer -->
                        <div id="word-choice-overlay" style="position:absolute; top:0; left:0; right:0; bottom:0; background: var(--overlay-bg); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
                            <div style="color: var(--text-main); font-size: 1.5rem; margin-bottom: 2rem; font-weight: bold; text-align: center;">Çizeceğin Kelimeyi Seç</div>
                            <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
                                <button class="btn btn-primary" id="btn-choice-1">Kelime 1</button>
                                <button class="btn btn-primary" id="btn-choice-2">Kelime 2</button>
                            </div>
                        </div>
                    </div>

                    <!-- Only visible to drawer -->
                    <div class="toolbar" id="toolbar" style="display: none;">
                        <div class="color-picker" id="color-picker">
                            <div class="color-swatch active" style="background: #000000;" data-color="#000000"></div>
                            <div class="color-swatch" style="background: #e74c3c;" data-color="#e74c3c"></div>
                            <div class="color-swatch" style="background: #3498db;" data-color="#3498db"></div>
                            <div class="color-swatch" style="background: #2ecc71;" data-color="#2ecc71"></div>
                            <div class="color-swatch" style="background: #f1c40f;" data-color="#f1c40f"></div>
                            <div class="color-swatch" style="background: #ffffff; border: 1px solid #ddd;" data-color="#ffffff"></div> <!-- Eraser -->
                            <div class="color-swatch custom-color-btn" style="background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); display: flex; align-items: center; justify-content: center; position: relative;" data-color="#ff0000" title="Özel Renk">
                                <span style="color: white; font-weight: bold; pointer-events: none; text-shadow: 0 0 2px black;">+</span>
                                <input type="color" class="custom-color-input" value="#ff0000" style="opacity: 0; position: absolute; width: 100%; height: 100%; cursor: pointer;">
                            </div>
                        </div>

                        <div class="size-picker" id="size-picker">
                            <div class="size-btn" data-size="3"><div class="size-dot" style="width: 4px; height: 4px;"></div></div>
                            <div class="size-btn active" data-size="8"><div class="size-dot" style="width: 8px; height: 8px;"></div></div>
                            <div class="size-btn" data-size="15"><div class="size-dot" style="width: 14px; height: 14px;"></div></div>
                            <div class="size-btn" data-size="25"><div class="size-dot" style="width: 20px; height: 20px;"></div></div>
                        </div>

                        <div class="tool-picker" id="tool-picker" style="display: flex; gap: 8px;">
                            <button class="btn btn-secondary btn-sm btn-icon tool-btn active" data-tool="brush" title="Fırça" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2l4 4-10 10H8v-4L18 2z"></path><path d="M14 6l4 4"></path><path d="M3 21h18"></path></svg>
                            </button>
                            <button class="btn btn-secondary btn-sm btn-icon tool-btn" data-tool="fill" title="Doldur" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11l-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0L19 11Z"></path><path d="M5 2l5 5"></path><path d="M2 13h15"></path><path d="M22 20a2 2 0 1 1-4 0c0-1.6 2-5 2-5s2 3.4 2 5Z"></path></svg>
                            </button>
                            <button class="btn btn-secondary btn-sm btn-icon tool-btn" data-tool="rect" title="Kare" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                            </button>
                            <button class="btn btn-secondary btn-sm btn-icon tool-btn" data-tool="circle" title="Daire" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
                            </button>
                            <button class="btn btn-secondary btn-sm btn-icon tool-btn" data-tool="line" title="Çizgi" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                        </div>

                        <div class="tools" style="display: flex; gap: 8px;">
                            <button class="btn btn-secondary btn-sm btn-icon" id="btn-undo" title="Geri Al" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
                            </button>
                            <button class="btn btn-secondary btn-sm btn-icon" id="btn-clear" title="Temizle" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="chat-panel card" style="display: flex; flex-direction: column; height: 300px; padding: 1rem;">
                        <div style="font-weight: bold; margin-bottom: 0.5rem; border-bottom: 1px solid var(--btn-secondary-bg); padding-bottom: 0.5rem;">Tahminler</div>
                        <div class="messages-container custom-scrollbar" id="messages-container" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px;"></div>
                        <div class="chat-input-wrapper" style="display: flex; gap: 8px;">
                            <input type="text" id="chat-input" class="game-input" placeholder="Tahmin yaz..." autocomplete="off" style="flex: 1; padding: 12px; border-radius: 8px;">
                            <button id="btn-send-chat" class="btn btn-primary btn-icon" style="padding: 0 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center;" aria-label="Gönder">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </div>

                    <div class="leaderboard card" style="margin-top: 1rem; padding: 1rem;">
                        <div style="font-weight: bold; margin-bottom: 0.5rem; border-bottom: 1px solid var(--btn-secondary-bg); padding-bottom: 0.5rem;">Skorlar</div>
                        <ul class="leaderboard-list custom-scrollbar" id="game-scores-list" style="list-style: none; padding: 0; max-height: 200px; overflow-y: auto;"></ul>
                    </div>
                </div>
            </div>
        </section>

        <!-- BİTİŞ EKRANI -->
        <section id="winner-screen" class="view-state hidden">
            <h1 class="gradient-text">Oyun Bitti!</h1>
            <div class="card" style="max-width: 500px; width: 100%; text-align: center; margin: 0 auto; display: flex; flex-direction: column;">
                <h2 style="font-size: 2rem; margin-bottom: 20px; color: var(--neon-purple);">Sıralama Tablosu</h2>

                <div id="final-scores" style="margin-bottom: 30px; display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto;" class="custom-scrollbar">
                    <!-- Skorlar buraya basılacak -->
                </div>

                <button id="btn-back-to-lobby" class="btn btn-primary btn-block" style="padding: 16px; font-size: 1.15rem; margin-top: auto;">Lobiye Dön</button>
            </div>
        </section>
    </main>

    <script src="../shared/shared.js"></script>
    <script src="../shared/peer_manager.js"></script>
    <script src="../shared/base_network.js"></script>
    <script src="../shared/state_proxy.js"></script>
    <script src="../shared/lobby_manager.js"></script>
    <script src="../shared/drawing.js"></script>
    <script src="../shared/cizbil_words.js"></script>
    <script src="game.js"></script>
    <script src="network.js"></script>

</body>
</html>
