<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

    <title>Paira Bilgi Yarışması | Oyun Odası</title>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/shared.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <main id="app-container" class="glass-panel custom-scrollbar">

        <!-- LOBI EKRANI -->
        <section id="lobby-screen" class="view-state active">
            <header class="lobby-header">
                <div class="code-container">
                    <h2 >Oda Kodu:</h2>
                    <span id="display-room-code" data-code="" >••••••••</span>
                    <button id="btn-toggle-code" class="toggle-btn" title="Göster/Gizle">👁️</button>
                </div>
                <button id="btn-copy-room" class="btn btn-secondary">Kopyala</button>
            </header>
            <div class="lobby-grid">
                <aside class="players-panel card">
                    <h3 >Oyuncular (<span id="player-count">0</span>)</h3>
                    <ul id="players-list" class="custom-scrollbar"></ul>
                </aside>

                <section class="settings-panel card custom-scrollbar" id="host-settings">
                    <h3 >Ayarlar</h3>
                    <div class="settings-grid">
                        <div class="form-group"><label>Tur Süresi (Sn)</label><input type="number" id="turn-duration" value="20" min="5" max="180"></div>
                        <div class="form-group"><label>Soru Sayısı</label><input type="number" id="round-count" value="10" min="1" max="50"></div>
                    </div>

                    <div class="form-group">
                        <label >
                            <input type="checkbox" id="wrong-penalty" checked >
                            Yanlış Cevap Cezası (-5 Puan)
                        </label>
                    </div>

                    <div class="form-group">
                        <label>Zorluk (1-100)</label>
                        <div class="difficulty-row">
                            <input type="number" id="min-difficulty" value="1" placeholder="Min"><input type="number" id="max-difficulty" value="100" placeholder="Max">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Kategoriler</label>
                        <div class="category-grid" id="category-selection"><div >Yükleniyor...</div></div>
                    </div>
                    <button id="btn-start-game" class="btn btn-primary btn-block mt-auto disabled">Başlat</button>
                </section>

                <section class="settings-panel card hidden" id="client-waiting">
                    <div >⏳</div>
                    <h3>Bekleniyor...</h3>
                    <p >Kurucu ayarları yapıyor.</p>
                </section>
            </div>
        </section>

        <!-- OYUN EKRANI -->
        <section id="game-screen" class="view-state hidden">
            <header class="game-topbar card">
                <div class="round-indicator" id="round-indicator">Soru 1 / 10</div>
                <div class="score-board" id="in-game-scoreboard">
                    <!-- Player scores injected here -->
                </div>

                <div class="timer-wrapper">
                    <div id="timer-display" class="timer">00:00</div>
                </div>
            </header>

            <div class="game-layout">
                <div id="game-status-message" class="status-badge">Hazırlanıyor...</div>

                <div id="question-card" class="taboo-card hidden">
                    <header class="card-header">
                        <span id="question-category" >Kategori</span>
                        <h2 id="main-question" >...</h2>
                    </header>

                    <div class="choices-grid" id="choices-container">
                        <!-- Dinamik Şıklar Gelecek -->
                        <button class="btn btn-secondary choice-btn" data-choice="0">A) ...</button>
                        <button class="btn btn-secondary choice-btn" data-choice="1">B) ...</button>
                        <button class="btn btn-secondary choice-btn" data-choice="2">C) ...</button>
                        <button class="btn btn-secondary choice-btn" data-choice="3">D) ...</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SONUÇ EKRANI -->
        <section id="winner-screen" class="view-state hidden">
            <h1 class="gradient-text">Oyun Bitti!</h1>
            <div class="card">
                <h2 >Sıralama</h2>

                <ul id="final-scoreboard-list" >
                    <!-- Final sıralama dinamik eklenecek -->
                </ul>

                <button id="btn-back-to-lobby" class="btn btn-primary btn-block">Lobiye Dön</button>
            </div>
        </section>
    </main>

    <script src="../shared/shared.js"></script>
    <script src="game.js"></script>
    <script src="network.js"></script>

<script>
        (function() {
            const savedTheme = localStorage.getItem('paira_theme') || 'paira';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</body>
</html>
