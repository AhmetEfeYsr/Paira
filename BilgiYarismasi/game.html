<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

    <title>Paira Bilgi Yarışması | Oyun Odası</title>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/shared.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <main id="app-container" class="glass-panel custom-scrollbar">

        <!-- LOBI EKRANI -->
        <section id="lobby-screen" class="view-state active">
            <header class="lobby-header">
                <div class="code-container">
                    <h2 class="auto-style-15">Oda Kodu:</h2>
                    <span id="display-room-code" data-code="" class="auto-style-16">••••••••</span>
                    <button id="btn-toggle-code" class="toggle-btn" title="Göster/Gizle">👁️</button>
                </div>
                <button id="btn-copy-room" class="btn btn-secondary">Kopyala</button>
            </header>
            <div class="lobby-grid">
                <aside class="players-panel card">
                    <h3 class="auto-style-17">Oyuncular (<span id="player-count">0</span>)</h3>
                    <ul id="players-list" class="custom-scrollbar"></ul>
                </aside>

                <section class="settings-panel card custom-scrollbar auto-style-19" id="host-settings">
                    <h3 class="auto-style-17">Ayarlar</h3>
                    <div class="settings-grid auto-style-20">
                        <div class="form-group auto-style-13"><label>Tur Süresi (Sn)</label><input type="number" id="turn-duration" value="20" min="5" max="180"></div>
                        <div class="form-group auto-style-13"><label>Soru Sayısı</label><input type="number" id="round-count" value="10" min="1" max="50"></div>
                    </div>

                    <div class="form-group auto-style-129">
                        <label class="auto-style-130">
                            <input type="checkbox" id="wrong-penalty" checked class="auto-style-131">
                            Yanlış Cevap Cezası (-5 Puan)
                        </label>
                    </div>

                    <div class="form-group">
                        <label>Zorluk (1-100)</label>
                        <div class="difficulty-row auto-style-12">
                            <input type="number" id="min-difficulty" value="1" placeholder="Min"><input type="number" id="max-difficulty" value="100" placeholder="Max">
                        </div>
                    </div>
                    <div class="form-group auto-style-21">
                        <label>Kategoriler</label>
                        <div class="category-grid" id="category-selection"><div class="auto-style-22">Yükleniyor...</div></div>
                    </div>
                    <button id="btn-start-game" class="btn btn-primary btn-block mt-auto disabled auto-style-23">Başlat</button>
                </section>

                <section class="settings-panel card hidden auto-style-24" id="client-waiting">
                    <div class="auto-style-25">⏳</div>
                    <h3>Bekleniyor...</h3>
                    <p class="auto-style-26">Kurucu ayarları yapıyor.</p>
                </section>
            </div>
        </section>

        <!-- OYUN EKRANI -->
        <section id="game-screen" class="view-state hidden">
            <header class="game-topbar card">
                <div class="round-indicator" id="round-indicator">Soru 1 / 10</div>
                <div class="score-board auto-style-132" id="in-game-scoreboard">
                    <!-- Player scores injected here -->
                </div>

                <div class="timer-wrapper auto-style-29">
                    <div id="timer-display" class="timer">00:00</div>
                </div>
            </header>

            <div class="game-layout auto-style-133">
                <div id="game-status-message" class="status-badge auto-style-134">Hazırlanıyor...</div>

                <div id="question-card" class="taboo-card hidden auto-style-135">
                    <header class="card-header auto-style-136">
                        <span id="question-category" class="auto-style-137">Kategori</span>
                        <h2 id="main-question" class="auto-style-138">...</h2>
                    </header>

                    <div class="choices-grid auto-style-139" id="choices-container">
                        <!-- Dinamik Şıklar Gelecek -->
                        <button class="btn btn-secondary choice-btn auto-style-140" data-choice="0">A) ...</button>
                        <button class="btn btn-secondary choice-btn auto-style-140" data-choice="1">B) ...</button>
                        <button class="btn btn-secondary choice-btn auto-style-140" data-choice="2">C) ...</button>
                        <button class="btn btn-secondary choice-btn auto-style-140" data-choice="3">D) ...</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SONUÇ EKRANI -->
        <section id="winner-screen" class="view-state hidden">
            <h1 class="gradient-text">Oyun Bitti!</h1>
            <div class="card auto-style-141">
                <h2 class="auto-style-38">Sıralama</h2>

                <ul id="final-scoreboard-list" class="auto-style-142">
                    <!-- Final sıralama dinamik eklenecek -->
                </ul>

                <button id="btn-back-to-lobby" class="btn btn-primary btn-block auto-style-143">Lobiye Dön</button>
            </div>
        </section>
    </main>

    <script src="../shared/shared.js"></script>
    <script src="game.js"></script>
    <script src="network.js"></script>

</body>
</html>
