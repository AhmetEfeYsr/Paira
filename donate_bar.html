<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paithon Hedefi — Buzlu Latte Bağış Bardağı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --lilac-title: #e6cfff;
      --lilac-amount: #d6b2ff;
      --lilac-complete: #f0e0ff;
      --lilac-glow: rgba(186, 134, 255, 0.58);
      --font-main: 'Fredoka', 'Nunito', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .latte-widget {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      min-width: 280px;
      padding: 12px 18px;
      user-select: none;
      contain: layout style;
    }

    .hidden {
      display: none !important;
    }

    /* Üst / Alt yazı slotları (panel yok, doğrudan şeffaf zemin üzerinde) */
    .latte-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      z-index: 6;
      contain: layout style;
    }

    .latte-slot-top {
      margin-bottom: 2px;
    }

    .latte-slot-bottom {
      margin-top: -6px;
    }

    .latte-label {
      font-family: var(--font-main);
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: 0.3px;
      text-align: center;
      white-space: nowrap;
      text-shadow:
        0 2px 3px rgba(18, 9, 30, 0.96),
        0 0 8px rgba(22, 10, 36, 0.88),
        0 0 16px var(--lilac-glow);
      transition: color 0.35s ease, text-shadow 0.35s ease;
    }

    .latte-label-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--lilac-title);
    }

    .latte-label-amount {
      font-size: 23px;
      font-weight: 700;
      color: var(--lilac-amount);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .latte-widget.goal-complete .latte-label {
      color: var(--lilac-complete);
      text-shadow:
        0 2px 3px rgba(18, 9, 30, 0.96),
        0 0 10px rgba(192, 132, 252, 0.85),
        0 0 22px rgba(216, 180, 254, 0.7);
    }

    /* Bardak sahnesi ve esnek zıplama (canlı drop-shadow yerine statik SVG gölgesi kullanılır) */
    .latte-stage {
      position: relative;
      width: 236px;
      height: 308px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center bottom;
      z-index: 4;
      pointer-events: none;
      contain: layout style;
    }

    .latte-widget.pouring .latte-stage {
      will-change: transform;
      animation: latteCupBounce 0.72s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Bağış geldiğinde bardağın yanında yükselen +miktar rozeti */
    .latte-delta {
      position: absolute;
      top: 28px;
      right: -2px;
      z-index: 10;
      padding: 5px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #f3d285 0%, #c084fc 100%);
      border: 2px solid rgba(255, 250, 244, 0.9);
      color: #1f1229;
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.2px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4), 0 0 14px rgba(192, 132, 252, 0.45);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transform: translate3d(0, 14px, 0) scale(0.8);
    }

    .latte-delta.show {
      will-change: transform, opacity;
      animation: latteDeltaPop 1.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .latte-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Arka parıltı */
    .latte-aura {
      opacity: 0.35;
      transition: opacity 0.8s ease;
    }

    .latte-widget.goal-complete .latte-aura {
      opacity: 1;
      will-change: opacity;
      animation: latteAuraPulse 2.6s ease-in-out infinite;
    }

    /* Sıvı seviyesi yükselme animasyonu */
    .latte-liquid-group {
      transition: transform 1.25s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    /* Sonsuz akıcı dalga döngüsü (period = 140px) — boşken GPU/CPU harcamaması için duraklatılır */
    .latte-wave-front {
      will-change: transform;
      animation: latteWaveFront 3.4s linear infinite;
    }

    .latte-wave-back {
      will-change: transform;
      animation: latteWaveBack 5.2s linear infinite;
    }

    .latte-widget.pouring .latte-wave-front {
      animation-duration: 1.5s;
    }

    .latte-widget.pouring .latte-wave-back {
      animation-duration: 2.2s;
    }

    /* Süt girdapları */
    .latte-swirl-1 {
      will-change: transform;
      animation: latteSwirlDrift 6.5s ease-in-out infinite alternate;
    }

    .latte-swirl-2 {
      will-change: transform;
      animation: latteSwirlDriftReverse 7.8s ease-in-out infinite alternate;
    }

    .latte-swirl-3 {
      will-change: transform;
      animation: latteSwirlDrift 9s ease-in-out infinite alternate;
    }

    /* Mikro baloncuklar */
    .latte-bubble {
      fill: #fff6ea;
      opacity: 0;
      will-change: transform, opacity;
      animation: latteBubbleRise 4.2s ease-in infinite;
    }

    .latte-bubble.b1 { animation-delay: 0s; animation-duration: 4.1s; }
    .latte-bubble.b2 { animation-delay: 1.2s; animation-duration: 4.9s; }
    .latte-bubble.b3 { animation-delay: 2.3s; animation-duration: 3.7s; }
    .latte-bubble.b4 { animation-delay: 0.7s; animation-duration: 4.5s; }
    .latte-bubble.b5 { animation-delay: 2.9s; animation-duration: 5.1s; }

    /* Bardak tamamen boşken görünmeyen sıvı animasyonlarını duraklat (0% boşta yük) */
    .latte-widget:not(.has-liquid) .latte-wave-front,
    .latte-widget:not(.has-liquid) .latte-wave-back,
    .latte-widget:not(.has-liquid) .latte-swirl-1,
    .latte-widget:not(.has-liquid) .latte-swirl-2,
    .latte-widget:not(.has-liquid) .latte-swirl-3,
    .latte-widget:not(.has-liquid) .latte-bubble {
      animation-play-state: paused;
      will-change: auto;
    }

    /* Kaynak gizliyken tüm animasyonları duraklat */
    .is-page-hidden * {
      animation-play-state: paused !important;
    }

    /* Espresso dökülme şeridi */
    .latte-pour-group {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .latte-widget.pouring .latte-pour-group {
      opacity: 1;
      animation: lattePourFlow 1.35s ease-out forwards;
    }

    /* Yüzey sıçrama damlacıkları */
    .latte-splash-group {
      transition: transform 1.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .splash-drop {
      fill: #e8b883;
      opacity: 0;
    }

    .latte-widget.pouring .splash-drop.s1 { animation: splashLeft 0.85s ease-out 0.1s forwards; }
    .latte-widget.pouring .splash-drop.s2 { animation: splashUp 0.75s ease-out 0.18s forwards; }
    .latte-widget.pouring .splash-drop.s3 { animation: splashRight 0.85s ease-out 0.12s forwards; }
    .latte-widget.pouring .splash-drop.s4 { animation: splashUp 0.68s ease-out 0.26s forwards; }

    /* Buz küplerinin yüzme ve sallanma hareketi */
    .ice-mover {
      transition: transform 1.35s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .ice-bob {
      transform-origin: 0 0;
    }

    .latte-widget.has-liquid .ice-bob {
      will-change: transform;
    }

    .latte-widget.has-liquid .ice-bob-1 { animation: iceBobA 3.6s ease-in-out infinite; }
    .latte-widget.has-liquid .ice-bob-2 { animation: iceBobB 4.1s ease-in-out infinite 0.4s; }
    .latte-widget.has-liquid .ice-bob-3 { animation: iceBobA 3.8s ease-in-out infinite 0.9s; }
    .latte-widget.has-liquid .ice-bob-4 { animation: iceBobB 3.3s ease-in-out infinite 0.2s; }
    .latte-widget.has-liquid .ice-bob-5 { animation: iceBobA 3.9s ease-in-out infinite 1.1s; }

    /* Hedef %100 kutlama yıldızları */
    .sparkle {
      fill: #ebd4ff;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    .latte-widget.goal-complete .sparkle {
      will-change: transform, opacity;
      animation: sparkleTwinkle 2s ease-in-out infinite;
    }
    .latte-widget.goal-complete .sp2 { animation-delay: 0.45s; }
    .latte-widget.goal-complete .sp3 { animation-delay: 0.95s; }
    .latte-widget.goal-complete .sp4 { animation-delay: 1.4s; }

    @keyframes latteWaveFront {
      0% { transform: translate3d(0px, 0, 0); }
      100% { transform: translate3d(-140px, 0, 0); }
    }

    @keyframes latteWaveBack {
      0% { transform: translate3d(-140px, 0, 0); }
      100% { transform: translate3d(0px, 0, 0); }
    }

    @keyframes latteSwirlDrift {
      0% { transform: translate3d(-8px, 0px, 0); }
      100% { transform: translate3d(9px, 3px, 0); }
    }

    @keyframes latteSwirlDriftReverse {
      0% { transform: translate3d(9px, 2px, 0); }
      100% { transform: translate3d(-8px, -2px, 0); }
    }

    @keyframes latteBubbleRise {
      0% { transform: translate3d(0, 24px, 0) scale(0.6); opacity: 0; }
      20% { opacity: 0.48; }
      80% { opacity: 0.25; }
      100% { transform: translate3d(0, -58px, 0) scale(1.1); opacity: 0; }
    }

    @keyframes iceBobA {
      0%, 100% { transform: translate3d(0, 0px, 0) rotate(-2.5deg); }
      50% { transform: translate3d(0, -4px, 0) rotate(2.8deg); }
    }

    @keyframes iceBobB {
      0%, 100% { transform: translate3d(0, 0px, 0) rotate(2.6deg); }
      50% { transform: translate3d(0, -3.5px, 0) rotate(-2.4deg); }
    }

    @keyframes latteCupBounce {
      0% { transform: scale3d(1, 1, 1); }
      25% { transform: scale3d(1.04, 0.96, 1); }
      55% { transform: scale3d(0.98, 1.03, 1); }
      80% { transform: scale3d(1.01, 0.99, 1); }
      100% { transform: scale3d(1, 1, 1); }
    }

    @keyframes lattePourFlow {
      0% { opacity: 0; }
      14% { opacity: 0.92; }
      75% { opacity: 0.78; }
      100% { opacity: 0; }
    }

    @keyframes splashLeft {
      0% { transform: translate3d(0, 0, 0) scale(0.5); opacity: 0.95; }
      60% { transform: translate3d(-15px, -22px, 0) scale(1); opacity: 0.8; }
      100% { transform: translate3d(-22px, -8px, 0) scale(0.3); opacity: 0; }
    }

    @keyframes splashRight {
      0% { transform: translate3d(0, 0, 0) scale(0.5); opacity: 0.95; }
      60% { transform: translate3d(15px, -20px, 0) scale(1); opacity: 0.8; }
      100% { transform: translate3d(22px, -6px, 0) scale(0.3); opacity: 0; }
    }

    @keyframes splashUp {
      0% { transform: translate3d(0, 0, 0) scale(0.5); opacity: 0.95; }
      55% { transform: translate3d(2px, -28px, 0) scale(1.05); opacity: 0.85; }
      100% { transform: translate3d(4px, -12px, 0) scale(0.25); opacity: 0; }
    }

    @keyframes latteDeltaPop {
      0% { opacity: 0; transform: translate3d(0, 14px, 0) scale(0.72); }
      18% { opacity: 1; transform: translate3d(0, -4px, 0) scale(1.06); }
      32% { transform: translate3d(0, -8px, 0) scale(1); }
      75% { opacity: 1; transform: translate3d(0, -20px, 0) scale(1); }
      100% { opacity: 0; transform: translate3d(0, -34px, 0) scale(0.92); }
    }

    @keyframes sparkleTwinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.65) rotate(0deg); }
      50% { opacity: 0.95; transform: scale(1.15) rotate(18deg); }
    }

    @keyframes latteAuraPulse {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="latte-widget" class="latte-widget">
    <!-- Üst yazı alanı (parametre ile başlık/miktar üstte seçilirse buraya taşınır) -->
    <div id="slot-top" class="latte-slot latte-slot-top hidden"></div>

    <!-- Buzlu Pipetli Latte Bardağı -->
    <div class="latte-stage">
      <!-- Bağış geldiğinde yükselen +miktar rozeti -->
      <div id="latte-delta" class="latte-delta" aria-hidden="true"></div>

      <svg id="latte-svg" class="latte-svg" viewBox="0 0 260 345" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paithon Hedefi Buzlu Pipetli Latte Bardağı">
        <defs>
          <!-- Statik bardak gölgesi: yalnızca 1 kez çizilir, dalga/buz animasyonlarında yeniden hesaplanmaz -->
          <filter id="latte-static-shadow" x="-25%" y="-15%" width="150%" height="145%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur" />
            <feOffset in="blur" dx="0" dy="12" result="offsetBlur" />
            <feFlood flood-color="#120904" flood-opacity="0.42" result="shadowColor" />
            <feComposite in="shadowColor" in2="offsetBlur" operator="in" />
          </filter>

          <clipPath id="latte-cup-clip">
            <path d="M 60,114 L 200,114 L 181,298 Q 179,312 165,312 L 95,312 Q 81,312 79,298 Z" />
          </clipPath>
          <clipPath id="latte-straw-top-clip">
            <rect x="132" y="10" width="12" height="50" rx="2.5" />
          </clipPath>
          <clipPath id="latte-straw-sub-clip">
            <rect x="132" y="58" width="12" height="238" rx="2" />
          </clipPath>
          <radialGradient id="latte-glow" cx="50%" cy="55%" r="50%">
            <stop offset="0%" stop-color="#d8a8ff" stop-opacity="0.34" />
            <stop offset="65%" stop-color="#c97d42" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#c97d42" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="latte-liquid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#6b3719" />
            <stop offset="10%" stop-color="#9c592d" />
            <stop offset="28%" stop-color="#c98952" />
            <stop offset="56%" stop-color="#e3be94" />
            <stop offset="82%" stop-color="#f2dec4" />
            <stop offset="100%" stop-color="#faefe0" />
          </linearGradient>
          <linearGradient id="latte-backwave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4e250f" stop-opacity="0.92" />
            <stop offset="100%" stop-color="#8b4d25" stop-opacity="0.85" />
          </linearGradient>
          <linearGradient id="latte-milk-swirl" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff8ee" stop-opacity="0.58" />
            <stop offset="50%" stop-color="#f6e2c6" stop-opacity="0.34" />
            <stop offset="100%" stop-color="#fff8ee" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="latte-pour-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#582910" stop-opacity="0.95" />
            <stop offset="60%" stop-color="#8f4e24" stop-opacity="0.88" />
            <stop offset="100%" stop-color="#c8854e" stop-opacity="0.3" />
          </linearGradient>
          <linearGradient id="latte-ice-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72" />
            <stop offset="45%" stop-color="#fff4e6" stop-opacity="0.36" />
            <stop offset="100%" stop-color="#e8d4bc" stop-opacity="0.22" />
          </linearGradient>
          <linearGradient id="latte-straw-shade" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
            <stop offset="28%" stop-color="#ffffff" stop-opacity="0.38" />
            <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.22" />
          </linearGradient>
          <linearGradient id="latte-glass-shine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48" />
            <stop offset="55%" stop-color="#ffffff" stop-opacity="0.16" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="latte-dome-grad" x1="15%" y1="0%" x2="85%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
            <stop offset="45%" stop-color="#ffffff" stop-opacity="0.14" />
            <stop offset="100%" stop-color="#e9d8c6" stop-opacity="0.24" />
          </linearGradient>
          <linearGradient id="latte-rim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78" />
            <stop offset="50%" stop-color="#f2e6d8" stop-opacity="0.48" />
            <stop offset="100%" stop-color="#cbb8a4" stop-opacity="0.58" />
          </linearGradient>
          <pattern id="latte-straw-stripes" width="12" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
            <rect width="12" height="14" fill="#fbf3e7" />
            <rect y="0" width="12" height="5.5" fill="#c97343" />
          </pattern>
        </defs>

        <!-- Statik dış gölge katmanı (animasyonlu içerikten izole, yalnızca gölgeyi çizer) -->
        <g filter="url(#latte-static-shadow)" aria-hidden="true">
          <path d="M 55,104 A 75,48 0 0 1 205,104 L 202,112 L 183,299 Q 181,314 166,314 L 94,314 Q 79,314 77,299 L 58,112 Z" fill="#000000" fill-opacity="0.72" />
        </g>

        <ellipse class="latte-aura" cx="130" cy="216" rx="88" ry="96" fill="url(#latte-glow)" />
        <ellipse cx="130" cy="322" rx="60" ry="9" fill="#000000" opacity="0.26" />
        <path d="M 58,112 L 202,112 L 183,299 Q 181,314 166,314 L 94,314 Q 79,314 77,299 Z" fill="#fff8ef" fill-opacity="0.14" />
        <ellipse cx="130" cy="306" rx="45" ry="6" fill="#ffffff" fill-opacity="0.16" />

        <!-- Pipet (bardak içi arka katman) -->
        <g transform="rotate(10.5 138 58)" opacity="0.92">
          <g clip-path="url(#latte-straw-sub-clip)">
            <rect x="132" y="58" width="12" height="238" fill="url(#latte-straw-stripes)" />
            <rect x="132" y="58" width="12" height="238" fill="url(#latte-straw-shade)" />
          </g>
        </g>

        <!-- Bardak içi sıvı, süt girdapları, buzlar, dökülme ve sıçrama -->
        <g clip-path="url(#latte-cup-clip)">
          <g id="latte-pour-group" class="latte-pour-group">
            <path d="M 127,108 Q 130,210 128,314 L 134,314 Q 135,210 133,108 Z" fill="url(#latte-pour-grad)" />
            <path d="M 129,110 L 130,310" stroke="#f5cfa0" stroke-width="1.4" stroke-linecap="round" opacity="0.55" />
          </g>

          <g id="latte-liquid-group" class="latte-liquid-group" style="transform: translate3d(0, 194px, 0);">
            <g class="latte-wave-back">
              <path d="M 0,123 Q 35,129 70,123 T 140,123 Q 175,129 210,123 T 280,123 Q 315,129 350,123 T 420,123 L 420,340 L 0,340 Z" fill="url(#latte-backwave-grad)" />
            </g>
            <g class="latte-wave-front">
              <path d="M 0,124 Q 35,118 70,124 T 140,124 Q 175,118 210,124 T 280,124 Q 315,118 350,124 T 420,124 L 420,340 L 0,340 Z" fill="url(#latte-liquid-grad)" />
              <path d="M 0,124 Q 35,118 70,124 T 140,124 Q 175,118 210,124 T 280,124 Q 315,118 350,124 T 420,124" fill="none" stroke="#fff0dc" stroke-width="3.6" stroke-linecap="round" opacity="0.72" />
            </g>
            <g class="latte-swirls">
              <path class="latte-swirl-1" d="M 48,162 C 88,148 118,186 164,166 C 188,156 206,164 218,176 C 194,192 152,196 116,184 C 86,174 64,182 48,174 Z" fill="url(#latte-milk-swirl)" />
              <path class="latte-swirl-2" d="M 52,212 C 92,198 134,230 184,206 C 200,198 210,208 212,222 C 176,242 128,238 88,224 C 70,218 58,226 52,220 Z" fill="url(#latte-milk-swirl)" />
              <path class="latte-swirl-3" d="M 60,264 C 102,250 144,274 192,256 C 198,274 152,292 104,280 C 82,275 68,278 60,272 Z" fill="url(#latte-milk-swirl)" opacity="0.85" />
            </g>
            <g class="latte-bubbles">
              <circle class="latte-bubble b1" cx="95" cy="210" r="2.2" />
              <circle class="latte-bubble b2" cx="145" cy="240" r="1.7" />
              <circle class="latte-bubble b3" cx="122" cy="185" r="2.5" />
              <circle class="latte-bubble b4" cx="164" cy="220" r="1.6" />
              <circle class="latte-bubble b5" cx="108" cy="260" r="1.9" />
            </g>
          </g>

          <!-- Sıvı arkasında yarı saydam pipet silüeti -->

    <!-- Alt yazı alanı (varsayılan olarak başlık ve hedef miktar burada görünür) -->
    <div id="slot-bottom" class="latte-slot latte-slot-bottom">
      <div id="goal-title" class="latte-label latte-label-title">Paithon Hedefi</div>
      <div id="goal-amount" class="latte-label latte-label-amount">0 / 20.000 TL</div>

  <script>
    (function () {
      'use strict';

      /*
       * URL PARAMETRELERİ:
       *   token       : Streamlabs Socket API Token
       *   baslik      : Başlık ("Paithon Hedefi") durumu -> alt | ust | gizle (veya 1 / 0)  [Varsayılan: alt]
       *   baslikKonum : Başlık konumu (baslik=1 kullanıldığında) -> alt | ust               [Varsayılan: alt]
       *   miktar      : Hedef miktar ("0 / 20.000 TL") durumu -> alt | ust | gizle (veya 1 / 0) [Varsayılan: alt]
       *   miktarKonum : Hedef miktar konumu (miktar=1 kullanıldığında) -> alt | ust         [Varsayılan: alt]
       *
       * TEST TUŞLARI:
       *   1 : +1.000 TL bağış (%5)
       *   2 : +5.000 TL bağış (%25)
       *   3 : Hedefi %100'e doldur (20.000 TL; zaten doluysa +2.000 TL ekler)
       *   4 : Sıfırla (0 TL, bardağı boşalt)
       */

      const GOAL_TITLE = 'Paithon Hedefi';
      const GOAL_TARGET = 20000;
      const GOAL_CURRENCY = 'TL';
      const STORAGE_KEY = 'paithon_iced_latte_goal_v1';

      const LIQUID_TOP_Y = 124;
      const LIQUID_BOTTOM_Y = 302;
      const LIQUID_EMPTY_Y = 318;

      const ICE_CUBES = [
        { id: 'ice-1', restX: 99,  topX: 88,  restY: 286, floatOffset: 24, el: null },
        { id: 'ice-2', restX: 130, topX: 129, restY: 290, floatOffset: 28, el: null },
        { id: 'ice-3', restX: 159, topX: 171, restY: 285, floatOffset: 23, el: null },
        { id: 'ice-4', restX: 113, topX: 109, restY: 263, floatOffset: 10, el: null },
        { id: 'ice-5', restX: 146, topX: 151, restY: 262, floatOffset: 11, el: null }
      ];

      // Sadece normal bağışlar kabul edilir; Kicks, Bits, Abonelik vb. kesinlikle yoksayılır
      const BLOCKED_EVENT_TYPES = new Set([
        'kicks',
        'kick_kicks',
        'kick',
        'kick_gift',
        'kick_sub',
        'kick_subscription',
        'bits',
        'cheer',
        'subscription',
        'resub',
        'sub',
        'submysterygift',
        'gift_sub',
        'gift_subscription',
        'gift',
        'follow',
        'host',
        'raid',
        'superchat',
        'membership',
        'merch',
        'loyalty_store_redemption'
      ]);

      // URL parametre okuyucuları (büyük/küçük harf duyarsız)
      const rawParams = new URLSearchParams(window.location.search);
      const paramMap = new Map();
      rawParams.forEach(function (val, key) {
        paramMap.set(key.toLowerCase(), val);
      });

      function getParam(keys) {
        for (let i = 0; i < keys.length; i++) {
          const k = keys[i].toLowerCase();
          if (paramMap.has(k)) {
            return { found: true, value: paramMap.get(k) };
          }
        }
        return { found: false, value: null };
      }

      function normalizePosition(raw) {
        if (raw == null) return null;
        const v = String(raw).trim().toLowerCase();
        if (v === 'ust' || v === 'üst' || v === 'top' || v === 'up' || v === 'yukari' || v === 'yukarı') {
          return 'top';
        }
        if (v === 'alt' || v === 'bottom' || v === 'down' || v === 'asagi' || v === 'aşağı') {
          return 'bottom';
        }
        return null;
      }

      function parseBoolToken(raw) {
        if (raw == null) return null;
        const v = String(raw).trim().toLowerCase();
        if (
          v === '1' || v === 'true' || v === 'yes' || v === 'evet' ||
          v === 'on' || v === 'goster' || v === 'göster' || v === 'show' ||
          v === 'var' || v === 'ac' || v === 'aç'
        ) {
          return true;
        }
        if (
          v === '0' || v === 'false' || v === 'no' || v === 'hayir' ||
          v === 'hayır' || v === 'off' || v === 'gizle' || v === 'hide' ||
          v === 'yok' || v === 'kapali' || v === 'kapalı'
        ) {
          return false;
        }
        return null;
      }

      function resolveTextSlot(mainKeys, posKeys) {
        const mainRaw = getParam(mainKeys);
        const posRaw = getParam(posKeys);

        let show = true;
        let pos = 'bottom';

        if (posRaw.found) {
          const explicitPos = normalizePosition(posRaw.value);
          if (explicitPos) pos = explicitPos;
        }

        if (mainRaw.found) {
          const asPos = normalizePosition(mainRaw.value);
          if (asPos) {
            show = true;
            pos = asPos;
          } else {
            const asBool = parseBoolToken(mainRaw.value);
            if (asBool !== null) {
              show = asBool;
            }
          }
        }

        return { show: show, pos: pos };
      }

      const tokenParam = getParam(['token']);
      const titleSlot = resolveTextSlot(['baslik', 'baslikgoster', 'baslik_goster'], ['baslikkonum', 'baslik_konum']);
      const amountSlot = resolveTextSlot(['miktar', 'hedefmiktar', 'hedef_miktar', 'miktargoster', 'miktar_goster'], ['miktarkonum', 'miktar_konum', 'hedefkonum', 'hedef_konum']);

      const CONFIG = {
        token: tokenParam.found ? String(tokenParam.value).trim() : '',
        titleSlot: titleSlot,
        amountSlot: amountSlot
      };

      // DOM elemanlarını bir kez önbelleğe al
      const elWidget = document.getElementById('latte-widget');
      const elSlotTop = document.getElementById('slot-top');
      const elSlotBottom = document.getElementById('slot-bottom');
      const elGoalTitle = document.getElementById('goal-title');
      const elGoalAmount = document.getElementById('goal-amount');
      const elLiquid = document.getElementById('latte-liquid-group');
      const elSplash = document.getElementById('latte-splash-group');
      const elDelta = document.getElementById('latte-delta');

      for (let i = 0; i < ICE_CUBES.length; i++) {
        ICE_CUBES[i].el = document.getElementById(ICE_CUBES[i].id);
      }

      // Sekme/kaynak görünür değilken animasyonları otomatik duraklat
      document.addEventListener('visibilitychange', function () {
        document.documentElement.classList.toggle('is-page-hidden', document.hidden);
      });

      function applyTextLayout() {
        elGoalTitle.textContent = GOAL_TITLE;
        elGoalTitle.classList.toggle('hidden', !CONFIG.titleSlot.show);
        elGoalAmount.classList.toggle('hidden', !CONFIG.amountSlot.show);

        if (CONFIG.titleSlot.show) {
          (CONFIG.titleSlot.pos === 'top' ? elSlotTop : elSlotBottom).appendChild(elGoalTitle);
        }
        if (CONFIG.amountSlot.show) {
          (CONFIG.amountSlot.pos === 'top' ? elSlotTop : elSlotBottom).appendChild(elGoalAmount);
        }

        const hasTop =
          (CONFIG.titleSlot.show && CONFIG.titleSlot.pos === 'top') ||
          (CONFIG.amountSlot.show && CONFIG.amountSlot.pos === 'top');
        const hasBottom =
          (CONFIG.titleSlot.show && CONFIG.titleSlot.pos === 'bottom') ||
          (CONFIG.amountSlot.show && CONFIG.amountSlot.pos === 'bottom');

        elSlotTop.classList.toggle('hidden', !hasTop);
        elSlotBottom.classList.toggle('hidden', !hasBottom);
      }

      function loadSavedAmount() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw == null) return 0;
          const parsed = parseFloat(raw);
          if (Number.isFinite(parsed) && parsed >= 0) return parsed;
        } catch (_) {}
        return 0;
      }

      function saveAmount(val) {
        try {
          window.localStorage.setItem(STORAGE_KEY, String(val));
        } catch (_) {}
      }

      function clearSavedAmount() {
        try {
          window.localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
      }

      const initialCurrent = loadSavedAmount();
      const state = {
        current: initialCurrent,
        displayedCurrent: initialCurrent
      };

      let pourTimer = null;
      let deltaTimer = null;
      let countAnimId = null;
      let lastRenderedAmountText = '';

      const numFormatInt = new Intl.NumberFormat('tr-TR');
      const numFormatDec = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const TARGET_SUFFIX = ' / ' + numFormatInt.format(GOAL_TARGET) + ' ' + GOAL_CURRENCY;

      function formatNumberTR(value) {
        const num = Number(value) || 0;
        const isInt = Math.abs(num - Math.round(num)) < 0.005;
        return isInt ? numFormatInt.format(Math.round(num)) : numFormatDec.format(num);
      }

      function formatGoalLine(currentVal) {
        return formatNumberTR(currentVal) + TARGET_SUFFIX;
      }

      function setAmountTextIfChanged(text) {
        if (text !== lastRenderedAmountText) {
          lastRenderedAmountText = text;
          elGoalAmount.textContent = text;
        }
      }

      function parseNumericAmount(value) {
        if (typeof value === 'number') {
          return Number.isFinite(value) ? value : NaN;
        }
        if (typeof value !== 'string') return NaN;

        const cleaned = value.trim().replace(/[^\d.,-]/g, '');
        if (!cleaned) return NaN;

        const lastComma = cleaned.lastIndexOf(',');
        const lastDot = cleaned.lastIndexOf('.');
        let normalized = cleaned;

        if (lastComma > -1 && lastDot > -1) {
          if (lastComma > lastDot) {
            normalized = cleaned.replace(/\./g, '').replace(',', '.');
          } else {
            normalized = cleaned.replace(/,/g, '');
          }
        } else if (lastComma > -1) {
          const decimals = cleaned.length - lastComma - 1;
          normalized = decimals === 3 ? cleaned.replace(/,/g, '') : cleaned.replace(',', '.');
        }

        const num = parseFloat(normalized);
        return Number.isFinite(num) ? num : NaN;
      }

      function animateCounter(fromVal, toVal) {
        if (countAnimId) {
          cancelAnimationFrame(countAnimId);
          countAnimId = null;
        }

        const duration = 850;
        const startTime = performance.now();

        function step(now) {
          const p = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          const val = fromVal + (toVal - fromVal) * eased;
          state.displayedCurrent = val;
          setAmountTextIfChanged(formatGoalLine(val));

          if (p < 1) {
            countAnimId = requestAnimationFrame(step);
          } else {
            state.displayedCurrent = toVal;
            setAmountTextIfChanged(formatGoalLine(toVal));
            countAnimId = null;
          }
        }

        countAnimId = requestAnimationFrame(step);
      }

      function triggerPourAnimation(deltaAmount) {
        elWidget.classList.remove('pouring');
        if (deltaAmount > 0) {
          elDelta.textContent = '+' + formatNumberTR(deltaAmount) + ' ' + GOAL_CURRENCY;
          elDelta.classList.remove('show');
        }

        // Çift reflow yerine tek reflow ile her iki animasyonu aynı karede başlat
        void elWidget.offsetWidth;

        elWidget.classList.add('pouring');
        clearTimeout(pourTimer);
        pourTimer = setTimeout(function () {
          elWidget.classList.remove('pouring');
        }, 1450);

        if (deltaAmount > 0) {
          elDelta.classList.add('show');
          clearTimeout(deltaTimer);
          deltaTimer = setTimeout(function () {
            elDelta.classList.remove('show');
          }, 1950);
        }
      }

      function updateVisuals(options) {
        const animatePour = Boolean(options && options.animatePour);
        const delta = (options && options.delta) || 0;
        const prevDisplayed = state.displayedCurrent;

        const rawPercent = (state.current / GOAL_TARGET) * 100;
        const clampedPercent = Math.max(0, Math.min(rawPercent, 100));

        // 1. Sıvı seviyesi (0 TL -> boş, >0 TL -> dipten yukarı dolum)
        const surfaceY =
          clampedPercent <= 0
            ? LIQUID_EMPTY_Y
            : LIQUID_BOTTOM_Y - (clampedPercent / 100) * (LIQUID_BOTTOM_Y - LIQUID_TOP_Y);

        elLiquid.style.transform = 'translate3d(0, ' + (surfaceY - LIQUID_TOP_Y).toFixed(1) + 'px, 0)';
        elSplash.style.transform = 'translate3d(0, ' + surfaceY.toFixed(1) + 'px, 0)';

        // 2. Yüzen buz küpleri (önbelleğe alınmış DOM referansları)
        for (let i = 0; i < ICE_CUBES.length; i++) {
          const cube = ICE_CUBES[i];
          if (!cube.el) continue;

          const y = Math.min(cube.restY, surfaceY + cube.floatOffset);
          const maxLift = Math.max(1, cube.restY - (LIQUID_TOP_Y + cube.floatOffset));
          const liftRatio = Math.max(0, Math.min(1, (cube.restY - y) / maxLift));
          const x = cube.restX + (cube.topX - cube.restX) * liftRatio;

          cube.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px, 0)';
        }

        // 3. Durum sınıfları
        elWidget.classList.toggle('has-liquid', clampedPercent > 0);
        elWidget.classList.toggle('goal-complete', rawPercent >= 100);

        // 4. Miktar yazısı
        if (Math.abs(state.current - prevDisplayed) > 0.001) {
          animateCounter(prevDisplayed, state.current);
        } else {
          setAmountTextIfChanged(formatGoalLine(state.current));
        }

        if (animatePour && delta > 0) {
          triggerPourAnimation(delta);
        }
      }

      function addDonation(amount, animatePour) {
        const add = Number(amount);
        if (!Number.isFinite(add) || add <= 0) return;
        state.current = Math.round((state.current + add) * 100) / 100;
        saveAmount(state.current);
        updateVisuals({ animatePour: animatePour !== false, delta: add });
      }

      function resetGoal() {
        state.current = 0;
        state.displayedCurrent = 0;
        clearSavedAmount();
        updateVisuals({ animatePour: false, delta: 0 });
      }

      // ==================== STREAMLABS SOCKET API (BYNOGAME / NORMAL DONATE) ====================
      const seenIds = new Set();

      function handleStreamlabsEvent(eventData) {
        if (!eventData || typeof eventData !== 'object') return;

        const eventFor = String(eventData.for || '').trim().toLowerCase();
        const eventType = String(eventData.type || '').trim().toLowerCase();

        // Sadece Streamlabs / ByNoGame normal bağışları (kicks, bits, sub, follow vb. hariç)
        if (eventFor && eventFor !== 'streamlabs' && eventFor !== 'bynogame') return;
        if (BLOCKED_EVENT_TYPES.has(eventType)) return;
        if (eventType !== 'donation' && eventType !== 'tip') return;

        const list = Array.isArray(eventData.message)
          ? eventData.message
          : eventData.message
            ? [eventData.message]
            : [];

        list.forEach(function (donation, idx) {
          if (!donation || typeof donation !== 'object') return;

          const msgType = String(donation.type || '').trim().toLowerCase();
          if (msgType && BLOCKED_EVENT_TYPES.has(msgType)) return;

          const msgCurrency = String(donation.currency || '').trim().toUpperCase();
          const formattedText = String(donation.formatted_amount || donation.formattedAmount || '').toLowerCase();
          if (
            formattedText.indexOf('kick') !== -1 ||
            formattedText.indexOf('bit') !== -1 ||
            formattedText.indexOf('sub') !== -1
          ) {
            return;
          }

          // Yalnızca TL / TRY (veya para birimi alanı boş normal bağış) kabul edilir
          if (msgCurrency && msgCurrency !== 'TRY' && msgCurrency !== 'TL' && msgCurrency !== '₺') {
            return;
          }

          const rawId =
            donation._id ||
            donation.id ||
            donation.event_id ||
            (eventData.event_id ? String(eventData.event_id) + '_' + idx : '');

          if (rawId && !donation.isTest) {
            const idKey = String(rawId);
            if (seenIds.has(idKey)) return;
            seenIds.add(idKey);
            if (seenIds.size > 500) {
              const oldest = seenIds.values().next().value;
              seenIds.delete(oldest);
            }
          }

          const amt = parseNumericAmount(
            donation.amount != null
              ? donation.amount
              : (donation.formatted_amount != null ? donation.formatted_amount : donation.formattedAmount)
          );

          if (Number.isFinite(amt) && amt > 0) {
            addDonation(amt, true);
          }
        });
      }

      window.handleStreamlabsEvent = handleStreamlabsEvent;

      function connectStreamlabs(token) {
        if (!token) return;

        let ws = null;
        let pingTimer = null;
        let reconnectTimer = null;
        let reconnectDelay = 2000;
        let closedIntentionally = false;

        function clearPing() {
          if (pingTimer) {
            clearInterval(pingTimer);
            pingTimer = null;
          }
        }

        function clearReconnect() {
          if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
          }
        }

        function connect() {
          clearReconnect();
          const wsUrl =
            'wss://sockets.streamlabs.com/socket.io/?token=' +
            encodeURIComponent(token) +
            '&EIO=3&transport=websocket';

          try {
            ws = new WebSocket(wsUrl);
          } catch (err) {
            console.error('[Paithon Latte] Streamlabs WebSocket açılamadı:', err);
            return;
          }

          ws.onopen = function () {
            reconnectDelay = 2000;
            console.info('[Paithon Latte] Streamlabs Socket API bağlantısı aktif.');
          };

          ws.onmessage = function (ev) {
            const msg = typeof ev.data === 'string' ? ev.data : '';
            if (!msg) return;

            if (msg.charAt(0) === '0') {
              try {
                const meta = JSON.parse(msg.slice(1));
                const interval = Number(meta.pingInterval) || 25000;
                clearPing();
                pingTimer = setInterval(function () {
                  if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send('2');
                  }
                }, interval);
              } catch (_) {}
              return;
            }

            if (msg === '2') {
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send('3');
              }
              return;
            }

            if (msg.slice(0, 2) === '42') {
              try {
                const bracketIdx = msg.indexOf('[');
                if (bracketIdx === -1) return;
                const packet = JSON.parse(msg.slice(bracketIdx));
                if (!Array.isArray(packet) || packet[0] !== 'event') return;
                handleStreamlabsEvent(packet[1]);
              } catch (err) {
                console.warn('[Paithon Latte] Streamlabs olayı okunamadı:', err);
              }
            }
          };

          ws.onclose = function () {
            clearPing();
            if (closedIntentionally) return;
            clearReconnect();
            reconnectTimer = setTimeout(connect, reconnectDelay);
            reconnectDelay = Math.min(Math.round(reconnectDelay * 1.5), 15000);
          };
        }

        window.addEventListener('beforeunload', function () {
          closedIntentionally = true;
          clearPing();
          clearReconnect();
          if (ws) ws.close();
        });

        connect();
      }

      // ==================== KLAVYE TEST TUŞLARI (1, 2, 3, 4) ====================
      window.addEventListener('pointerdown', function () {
        if (document.body && typeof document.body.focus === 'function') {
          document.body.focus();
        }
      });

      window.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

        const key = e.key;
        const code = e.code;

        if (key === '1' || code === 'Digit1' || code === 'Numpad1') {
          addDonation(1000, true);
        } else if (key === '2' || code === 'Digit2' || code === 'Numpad2') {
          addDonation(5000, true);
        } else if (key === '3' || code === 'Digit3' || code === 'Numpad3') {
          const remaining = GOAL_TARGET - state.current;
          addDonation(remaining > 0 ? Math.round(remaining * 100) / 100 : 2000, true);
        } else if (key === '4' || code === 'Digit4' || code === 'Numpad4') {
          resetGoal();
        }
      });

      // Başlat
      applyTextLayout();
      updateVisuals({ animatePour: false, delta: 0 });
      connectStreamlabs(CONFIG.token);

      console.info(
        '[Paithon Latte] Hazır | Test tuşları: [1] +1.000 TL, [2] +5.000 TL, [3] 20.000 TL Doldur, [4] Sıfırla',
        {
          title: GOAL_TITLE,
          target: GOAL_TARGET,
          current: state.current,
          baslik: CONFIG.titleSlot,
          miktar: CONFIG.amountSlot,
          socketConnected: Boolean(CONFIG.token)
        }
      );
    })();
  </script>
