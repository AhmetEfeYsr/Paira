<!DOCTYPE html>
<html lang="tr">
<head>
    <script src="shared/shared.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>İletişim | Paira Games</title>
    <meta name="description" content="Paira Games ile iletişime geçin. Soru, öneri ve destek talepleriniz için bize ulaşın.">
    <link rel="canonical" href="https://pairaaa.com/iletisim.html">
    <link rel="icon" type="image/svg+xml" href="https://pairaaa.com/main_logo.svg">
    <link rel="apple-touch-icon" href="https://pairaaa.com/main_logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shared/shared.css">
    <style>
        .contact-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            color: var(--text-main);
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
        }
        .contact-container h1 {
            color: var(--neon-purple);
            text-align: center;
            margin-bottom: 2rem;
        }
        .contact-info {
            margin-bottom: 2rem;
        }
        .contact-info p {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .contact-info a {
            color: var(--neon-purple);
            text-decoration: none;
            font-weight: 500;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--lilac);
        }
        textarea.game-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--lilac-muted);
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            resize: vertical;
            min-height: 120px;
        }
        textarea.game-input:focus {
            outline: none;
            border-color: var(--neon-purple);
            background: rgba(var(--primary-rgb), 0.1);
            box-shadow: 0 0 15px var(--neon-glow-rgba);
        }
    </style>
</head>
<body>
    <main id="app-container" class="glass-panel custom-scrollbar">
        <div class="contact-container">
            <h1>İletişim</h1>

            <div class="contact-info">
                <p>Sorularınız, önerileriniz veya destek talepleriniz için aşağıdaki e-posta adreslerinden bize ulaşabilirsiniz:</p>
                <p><strong>Genel İletişim:</strong> <a href="mailto:iletisim@pairaaa.com">iletisim@pairaaa.com</a></p>
                <p><strong>Destek & Hata Bildirimi:</strong> <a href="mailto:Destek@pairaaa.com">Destek@pairaaa.com</a></p>
            </div>

            <form class="contact-form" onsubmit="event.preventDefault(); alert('Mesajınız için teşekkürler! Lütfen e-posta adreslerimizden doğrudan bize ulaşın.');">
                <div class="form-group">
                    <label for="name">Adınız Soyadınız</label>
                    <input type="text" id="name" class="game-input" placeholder="Adınız Soyadınız">
                </div>
                <div class="form-group">
                    <label for="email">E-posta Adresiniz</label>
                    <input type="text" id="email" class="game-input" placeholder="ornek@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Mesajınız</label>
                    <textarea id="message" class="game-input" placeholder="Mesajınızı buraya yazın..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Gönder</button>
            </form>
        </div>
    </main>
</body>
</html>
