<!DOCTYPE html>
<html lang="tr">

<head>
    <script src="shared/shared.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>İletişim | Paira Games</title>
    <meta name="description"
        content="Paira Games ile iletişime geçin. Soru, öneri ve destek talepleriniz için bize ulaşın.">
    <link rel="canonical" href="https://pairaaa.com/iletisim.html">

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shared/shared.css">
    <style>
        .contact-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            color: var(--text-main);
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
        }

        .contact-container h1 {
            color: var(--neon-purple);
            text-align: center;
            margin-bottom: 2rem;
        }

        .contact-info {
            margin-bottom: 2rem;
        }

        .contact-info p {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .contact-info a {
            color: var(--neon-purple);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--lilac);
        }

        textarea.game-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--lilac-muted);
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            resize: vertical;
            min-height: 120px;
        }

        textarea.game-input:focus {
            outline: none;
            border-color: var(--neon-purple);
            background: rgba(var(--primary-rgb), 0.1);
            box-shadow: 0 0 15px var(--neon-glow-rgba);
        }
    </style>

    <!-- Favicons -->
    <link rel="icon" type="image/webp" href="https://pairaaa.com/main_logo.webp">
    <link rel="apple-touch-icon" href="https://pairaaa.com/main_logo.webp">

    <meta property="og:image" content="https://pairaaa.com/main_logo.webp">
    <meta property="twitter:image" content="https://pairaaa.com/main_logo.webp">
</head>

<body>
    <main id="app-container" class="glass-panel custom-scrollbar">
        <div class="contact-container">
            <h1>İletişim</h1>

            <div class="contact-info">
                <p>Sorularınız, önerileriniz veya destek talepleriniz için aşağıdaki e-posta adreslerinden bize
                    ulaşabilirsiniz:</p>
                <p><strong>Genel İletişim:</strong> <a href="mailto:iletisim@pairaaa.com">iletisim@pairaaa.com</a></p>
                <p><strong>Destek & Hata Bildirimi:</strong> <a href="mailto:Destek@pairaaa.com">Destek@pairaaa.com</a>
                </p>
            </div>

            <form id="contactForm" class="contact-form">
                <!-- Güvenlik için Access Key (https://web3forms.com/ sayfasından ücretsiz emailinizi yazarak alınacak) -->
                <input type="hidden" name="access_key" value="4a0eb273-9334-4641-815d-63e313702c58">
                <!-- Spam koruması için gizli alan -->
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div class="form-group">
                    <label for="name">Adınız Soyadınız</label>
                    <input type="text" id="name" name="name" class="game-input" placeholder="Adınız Soyadınız" required>
                </div>
                <div class="form-group">
                    <label for="email">E-posta Adresiniz</label>
                    <input type="email" id="email" name="email" class="game-input" placeholder="ornek@email.com"
                        required>
                </div>
                <div class="form-group">
                    <label for="message">Mesajınız</label>
                    <textarea id="message" name="message" class="game-input" placeholder="Mesajınızı buraya yazın..."
                        required></textarea>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary"
                    style="width: 100%; padding: 12px;">Gönder</button>
            </form>

            <script>
                document.getElementById('contactForm').addEventListener('submit', async function (event) {
                    event.preventDefault(); // Sayfanın yenilenmesini engelle
                    const form = event.target;
                    const submitBtn = document.getElementById('submitBtn');

                    const accessKey = form.querySelector('[name="access_key"]').value;
                    if (accessKey === "BURAYA_WEB3FORMS_ACCESS_KEY_YAZILACAK" || !accessKey) {
                        alert("Lütfen kaynak kodundan (iletisim.html) Web3Forms Access Key'inizi ekleyin! (Anahtarı https://web3forms.com/ adresinden e-mailiniz ile alabilirsiniz)");
                        return; // Key girilmemişse fonksiyondan çık işlemi durdur
                    }

                    submitBtn.textContent = "Gönderiliyor...";
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = "0.7";

                    const formData = new FormData(form);

                    try {
                        const response = await fetch('https://api.web3forms.com/submit', {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();

                        if (response.status === 200) {
                            alert("Mesajınız başarıyla gönderildi! Size en kısa sürede dönüş yapacağız.");
                            form.reset(); // Form alanlarını temizle
                        } else {
                            alert("Bir hata oluştu: " + result.message);
                        }
                    } catch (error) {
                        alert("Mesajınız gönderilemedi. Lütfen internet bağlantınızı kontrol edip tekrar deneyin.");
                    } finally {
                        submitBtn.textContent = "Gönder";
                        submitBtn.disabled = false;
                        submitBtn.style.opacity = "1";
                    }
                });
            </script>
        </div>
    </main>
</body>

</html>
