<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS Dark Neon Purple & Black Starfield</title>
  <style>
    /* =========================================================
       FULLSCREEN OBS BROWSER SOURCE RESET
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #030007;
      user-select: none;
      -webkit-user-select: none;
    }

    /* =========================================================
       VOID OBSIDIAN BACKDROP
       ========================================================= */
    .void-scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 85% 75% at 50% 45%, #090115 0%, #05000c 52%, #030007 100%);
    }

    /* =========================================================
       SUBTLE BREATHING NEON PURPLE / VIOLET NEBULA GLOWS
       Optimized for minimal GPU load in OBS (no heavy blur / blend)
       ========================================================= */
    .nebula-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .nebula {
      position: absolute;
      border-radius: 50%;
      will-change: transform, opacity;
    }

    /* Deep Electric Violet Nebula - Upper Left */
    .nebula-1 {
      width: 62vw;
      height: 54vw;
      top: -18vw;
      left: -12vw;
      background: radial-gradient(
        ellipse at center,
        rgba(124, 58, 237, 0.22) 0%,
        rgba(124, 58, 237, 0.09) 38%,
        rgba(9, 1, 21, 0) 72%
      );
      animation: nebulaDrift1 28s ease-in-out infinite;
    }

    /* Soft Neon Purple Aurora Glow - Bottom Right */
    .nebula-2 {
      width: 66vw;
      height: 52vw;
      bottom: -20vw;
      right: -14vw;
      background: radial-gradient(
        ellipse at center,
        rgba(168, 85, 247, 0.20) 0%,
        rgba(124, 58, 237, 0.08) 42%,
        rgba(3, 0, 7, 0) 74%
      );
      animation: nebulaDrift2 34s ease-in-out infinite;
    }

    /* Faint Neon Magenta Accent - Center-Right Drift */
    .nebula-3 {
      width: 48vw;
      height: 40vw;
      top: 16vh;
      right: 6vw;
      background: radial-gradient(
        ellipse at center,
        rgba(217, 70, 239, 0.12) 0%,
        rgba(168, 85, 247, 0.05) 45%,
        rgba(3, 0, 7, 0) 72%
      );
      animation: nebulaDrift3 31s ease-in-out infinite;
    }

    /* Deep Violet Ambient Ribbon - Lower Left */
    .nebula-4 {
      width: 50vw;
      height: 44vw;
      bottom: -14vw;
      left: 8vw;
      background: radial-gradient(
        ellipse at center,
        rgba(124, 58, 237, 0.16) 0%,
        rgba(217, 70, 239, 0.05) 44%,
        rgba(3, 0, 7, 0) 72%
      );
      animation: nebulaDrift4 26s ease-in-out infinite;
    }

    @keyframes nebulaDrift1 {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
        opacity: 0.72;
      }
      50% {
        transform: translate3d(6vw, 5vh, 0) scale(1.12) rotate(8deg);
        opacity: 1;
      }
    }

    @keyframes nebulaDrift2 {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
        opacity: 0.68;
      }
      50% {
        transform: translate3d(-7vw, -6vh, 0) scale(1.1) rotate(-7deg);
        opacity: 0.98;
      }
    }

    @keyframes nebulaDrift3 {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(0.95);
        opacity: 0.55;
      }
      50% {
        transform: translate3d(-5vw, 7vh, 0) scale(1.15);
        opacity: 0.92;
      }
    }

    @keyframes nebulaDrift4 {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 0.62;
      }
      50% {
        transform: translate3d(5vw, -6vh, 0) scale(1.1);
        opacity: 0.95;
      }
    }

    /* =========================================================
       STARFIELD & METEOR CANVAS
       ========================================================= */
    #starfield-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: none;
    }

    /* =========================================================
       DEEP VOID EDGE VIGNETTE
       ========================================================= */
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        ellipse 78% 76% at 50% 50%,
        rgba(3, 0, 7, 0) 48%,
        rgba(3, 0, 7, 0.36) 82%,
        rgba(2, 0, 5, 0.72) 100%
      );
    }
  </style>
</head>
<body>
  <div class="void-scene" aria-hidden="true">
    <!-- Ambient Dark Neon Purple / Violet Nebula Glows -->
    <div class="nebula-layer">
      <div class="nebula nebula-1"></div>
      <div class="nebula nebula-2"></div>
      <div class="nebula nebula-3"></div>
      <div class="nebula nebula-4"></div>
    </div>

    <!-- Canvas: Multi-Layer Twinkling Stars, Micro-Stardust & Shooting Stars -->
    <canvas id="starfield-canvas"></canvas>

    <!-- Subtle Deep Edge Vignette -->
    <div class="vignette"></div>
  </div>

  <script>
    /**
     * OBS Low-Load 24fps Starfield, Micro-Stardust & Shooting Star Engine
     * Uses pre-rendered sprite textures and 1x scaling for minimal GPU/CPU impact.
     */
    (function () {
      'use strict';

      const canvas = document.getElementById('starfield-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d', { alpha: true });
      if (!ctx) return;

      let width = 0;
      let height = 0;
      let dpr = 1;

      const stars = [];
      const stardust = [];
      const meteors = [];

      let nextMeteorTimer = 2.2;
      let lastTimestamp = 0;

      // 24 FPS sınırı ve GPU dostu önbellekli parlama dokuları
      const TARGET_FPS = 24;
      const FRAME_INTERVAL = 1000 / TARGET_FPS;
      let lastFrameTime = 0;

      const spriteCache = new Map();
      function getGlowSprite(rgb) {
        let sprite = spriteCache.get(rgb);
        if (sprite) return sprite;

        const size = 64;
        const half = size / 2;
        sprite = document.createElement('canvas');
        sprite.width = size;
        sprite.height = size;
        const sctx = sprite.getContext('2d');

        const grad = sctx.createRadialGradient(half, half, 0, half, half, half);
        grad.addColorStop(0, `rgba(${rgb}, 1)`);
        grad.addColorStop(0.32, `rgba(${rgb}, 0.5)`);
        grad.addColorStop(0.68, `rgba(${rgb}, 0.14)`);
        grad.addColorStop(1, `rgba(${rgb}, 0)`);

        sctx.fillStyle = grad;
        sctx.fillRect(0, 0, size, size);

        spriteCache.set(rgb, sprite);
        return sprite;
      }

      const HALO_SPRITE = getGlowSprite('168, 85, 247');
      const WHITE_SPRITE = getGlowSprite('255, 255, 255');

      const STAR_PALETTE = [
        { rgb: '255, 255, 255', weight: 0.48 },
        { rgb: '243, 232, 255', weight: 0.22 },
        { rgb: '216, 180, 254', weight: 0.14 },
        { rgb: '168, 85, 247',  weight: 0.10 },
        { rgb: '217, 70, 239',  weight: 0.06 }
      ];

      const DUST_PALETTE = [
        '168, 85, 247',
        '124, 58, 237',
        '217, 70, 239',
        '233, 213, 255'
      ];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function pickWeightedStarColor() {
        let r = Math.random();
        for (let i = 0; i < STAR_PALETTE.length; i++) {
          r -= STAR_PALETTE[i].weight;
          if (r <= 0) return STAR_PALETTE[i].rgb;
        }
        return STAR_PALETTE[0].rgb;
      }

      function initSceneObjects() {
        stars.length = 0;
        stardust.length = 0;

        const area = width * height;
        const starCount = Math.min(220, Math.max(100, Math.floor(area / 10500)));

        for (let i = 0; i < starCount; i++) {
          const roll = Math.random();
          let layer = 0;
          if (roll > 0.88) layer = 2;
          else if (roll > 0.48) layer = 1;

          const baseRadius =
            layer === 0 ? rand(0.45, 0.95) :
            layer === 1 ? rand(0.95, 1.55) :
            rand(1.55, 2.45);

          const speedMult = layer === 0 ? 1 : layer === 1 ? 1.85 : 2.9;
          const rgb = pickWeightedStarColor();

          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            layer: layer,
            baseRadius: baseRadius,
            vx: rand(1.1, 2.6) * speedMult,
            vy: -rand(2.0, 4.4) * speedMult,
            twinkleSpeed: rand(0.55, 2.2),
            twinklePhase: rand(0, Math.PI * 2),
            minAlpha: layer === 0 ? rand(0.18, 0.4) : rand(0.32, 0.55),
            maxAlpha: layer === 0 ? rand(0.55, 0.82) : rand(0.82, 1.0),
            rgb: rgb,
            sprite: getGlowSprite(rgb),
            hasSparkle: layer === 2 && Math.random() < 0.45
          });
        }

        const dustCount = Math.min(45, Math.max(20, Math.floor(area / 50000)));
        for (let i = 0; i < dustCount; i++) {
          const rgb = DUST_PALETTE[Math.floor(Math.random() * DUST_PALETTE.length)];
          stardust.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: rand(1.4, 3.6),
            vy: -rand(5, 14),
            swayAmp: rand(10, 28),
            swaySpeed: rand(0.25, 0.65),
            phase: rand(0, Math.PI * 2),
            pulseSpeed: rand(0.5, 1.3),
            maxAlpha: rand(0.10, 0.28),
            sprite: getGlowSprite(rgb)
          });
        }
      }

      function spawnMeteor() {
        const fromLeft = Math.random() < 0.65;
        const startX = fromLeft ? rand(width * 0.04, width * 0.68) : rand(width * 0.32, width * 0.96);
        const startY = rand(-20, height * 0.38);

        const angle = fromLeft
          ? rand(Math.PI * 0.14, Math.PI * 0.26)
          : rand(Math.PI * 0.74, Math.PI * 0.86);

        const speed = rand(680, 1080);

        meteors.push({
          x: startX,
          y: startY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          length: rand(130, 240),
          thickness: rand(1.4, 2.3),
          life: 0,
          maxLife: rand(0.75, 1.35)
        });
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = 1;

        canvas.width = width;
        canvas.height = height;
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        initSceneObjects();
      }

      function drawSparkleCross(x, y, size, alpha, rgb) {
        ctx.globalAlpha = alpha * 0.65;
        ctx.strokeStyle = `rgb(${rgb})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(x - size, y);
        ctx.lineTo(x + size, y);
        ctx.moveTo(x, y - size);
        ctx.lineTo(x, y + size);
        ctx.stroke();
      }

      function render(now) {
        requestAnimationFrame(render);

        if (document.hidden || now - lastFrameTime < FRAME_INTERVAL) return;
        lastFrameTime = now;

        if (!lastTimestamp) lastTimestamp = now;
        const dt = Math.min((now - lastTimestamp) / 1000, 0.1);
        lastTimestamp = now;
        const t = now * 0.001;

        ctx.clearRect(0, 0, width, height);

        // 1. Önbellekli yıldız tozu çizimi
        for (let i = 0; i < stardust.length; i++) {
          const d = stardust[i];
          d.y += d.vy * dt;

          if (d.y < -20) {
            d.y = height + 20;
            d.x = Math.random() * width;
          }

          const drawX = d.x + Math.sin(t * d.swaySpeed + d.phase) * d.swayAmp;
          const drawY = d.y;
          const shimmer = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * d.pulseSpeed + d.phase));

          const edgeFade = Math.min(
            1,
            Math.max(0, Math.min(drawY / (height * 0.1), (height - drawY) / (height * 0.1)))
          );
          const alpha = d.maxAlpha * shimmer * edgeFade;
          if (alpha <= 0.004) continue;

          const glowR = d.radius * 3.4;
          ctx.globalAlpha = alpha;
          ctx.drawImage(d.sprite, drawX - glowR, drawY - glowR, glowR * 2, glowR * 2);
        }

        // 2. Önbellekli çok katmanlı yıldız çizimi
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;

          if (s.x > width + 10) s.x = -10;
          if (s.y < -10) s.y = height + 10;

          const wave = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinklePhase);
          const alpha = s.minAlpha + (s.maxAlpha - s.minAlpha) * wave;
          const radius = s.baseRadius * (0.82 + 0.32 * wave);

          if (s.layer === 2 || (s.layer === 1 && s.baseRadius > 1.35)) {
            const haloR = radius * (s.layer === 2 ? 4.8 : 3.2);
            ctx.globalAlpha = alpha * 0.55;
            ctx.drawImage(HALO_SPRITE, s.x - haloR, s.y - haloR, haloR * 2, haloR * 2);
          }

          const coreR = radius * 1.9;
          ctx.globalAlpha = alpha;
          ctx.drawImage(s.sprite, s.x - coreR, s.y - coreR, coreR * 2, coreR * 2);

          if (s.layer === 2) {
            const pinR = radius * 0.9;
            ctx.globalAlpha = alpha * 0.9;
            ctx.drawImage(WHITE_SPRITE, s.x - pinR, s.y - pinR, pinR * 2, pinR * 2);

            if (s.hasSparkle && wave > 0.45) {
              drawSparkleCross(s.x, s.y, radius * (2.6 + wave * 1.4), alpha, s.rgb);
            }
          }
        }

        // 3. Kayan yıldızlar (meteorlar)
        nextMeteorTimer -= dt;
        if (nextMeteorTimer <= 0) {
          spawnMeteor();
          nextMeteorTimer = rand(3.2, 7.8);
        }

        if (meteors.length > 0) {
          ctx.lineCap = 'round';
          for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            m.life += dt;
            m.x += m.vx * dt;
            m.y += m.vy * dt;

            const progress = m.life / m.maxLife;
            if (progress >= 1 || m.x < -300 || m.x > width + 300 || m.y > height + 300) {
              meteors.splice(i, 1);
              continue;
            }

            const opacity =
              progress < 0.15
                ? progress / 0.15
                : Math.pow(1 - (progress - 0.15) / 0.85, 1.35);

            const speedMag = Math.hypot(m.vx, m.vy);
            const dirX = m.vx / speedMag;
            const dirY = m.vy / speedMag;

            const tailX = m.x - dirX * m.length;
            const tailY = m.y - dirY * m.length;

            const tailGrad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
            tailGrad.addColorStop(0, `rgba(255, 255, 255, ${opacity})`);
            tailGrad.addColorStop(0.25, `rgba(233, 213, 255, ${opacity * 0.8})`);
            tailGrad.addColorStop(0.65, `rgba(168, 85, 247, ${opacity * 0.35})`);
            tailGrad.addColorStop(1, 'rgba(124, 58, 237, 0)');

            ctx.globalAlpha = 1;
            ctx.strokeStyle = tailGrad;
            ctx.lineWidth = m.thickness;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();

            ctx.globalAlpha = opacity;
            ctx.drawImage(WHITE_SPRITE, m.x - 14, m.y - 14, 28, 28);
          }
        }

        ctx.globalAlpha = 1;
      }

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('load', function () {
        resize();
        requestAnimationFrame(render);
      });
    })();
  </script>
</body>
</html>
