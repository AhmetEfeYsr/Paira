<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oyun | ÇizBil (Gartic)</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../shared/shared.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .cizbil-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        .game-area { flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
        .sidebar { flex: 1; min-width: 300px; max-width: 350px; background: rgba(0,0,0,0.3); border-left: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 1rem; }

        .header-bar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .word-display { font-size: 2rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--glow-primary); background: rgba(0,0,0,0.4); padding: 0.5rem 2rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); }

        .canvas-container { position: relative; width: 100%; max-width: 800px; background: #fff; border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: crosshair; touch-action: none; border: 4px solid var(--border-color); }
        canvas { display: block; width: 100%; height: auto; aspect-ratio: 16/9; }
        [data-theme="light"] .canvas-container { box-shadow: 0 5px 20px rgba(0,0,0,0.1); border-color: var(--lilac-muted); }

        .toolbar { display: flex; gap: 1rem; margin-top: 1rem; padding: 1rem; background: var(--card-bg); border-radius: 1rem; border: 1px solid var(--border-color); width: 100%; max-width: 800px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .color-picker { display: flex; gap: 0.5rem; }
        .color-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; }
        .color-swatch:hover { transform: scale(1.1); }
        .color-swatch.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.8); }

        .size-picker { display: flex; gap: 0.5rem; align-items: center; }
        .size-btn { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
        .size-btn.active { background: rgba(255,255,255,0.3); border-color: #fff; }
        .size-dot { background: var(--text-main); border-radius: 50%; }

        .tools { display: flex; gap: 0.5rem; }

        .sidebar-header { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
        .chat-feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 0.5rem; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 0.5rem 0.8rem; border-radius: 0.5rem; font-size: 0.9rem; word-break: break-word; }
        .chat-msg strong { color: var(--primary); }
        .chat-msg.correct { background: rgba(46, 204, 113, 0.2); border: 1px solid var(--success); }

        .leaderboard { height: 30%; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; display: flex; flex-direction: column; }
        .leaderboard-list { overflow-y: auto; flex: 1; font-size: 0.9rem; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        @media (max-width: 768px) {
            .cizbil-layout { flex-direction: column; }
            .sidebar { max-width: 100%; height: 40vh; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
            .leaderboard { display: none; }
        }

        .word-choice-modal {
            position: fixed;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 300px;
        }
        .word-choice-title {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            font-weight: bold;
            text-align: left;
        }
        .word-choice-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }
        .word-choice-buttons button {
            width: 100%;
            text-align: left;
            padding: 10px 15px;
        }
    </style>
</head>
<body>
    <div class="glass-bg"></div>

    <div class="cizbil-layout">
        <div class="game-area">
            <div class="header-bar" style="justify-content: flex-end; gap: 1rem;">
                <!-- Word display is moved to absolute top-left for OBS hiding -->
                <div class="word-display" id="main-word" style="position: fixed; top: 20px; left: 20px; z-index: 998; font-size: 1.5rem; padding: 0.5rem 1.5rem;">Yükleniyor...</div>

                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div style="font-size: 1rem; font-weight: bold; color: var(--text-main);">
                        <span id="status-badge" style="color: var(--warning);">Bağlanıyor...</span>
                    </div>
                    <button class="btn btn-secondary btn-sm" id="btn-leave">Çıkış</button>
                </div>
            </div>

            <!-- Moved out of canvas-container for fixed positioning across the entire window -->
            <div id="word-choice-overlay" class="word-choice-modal" style="display: none;">
                <div class="word-choice-title">Çizeceğin Kelimeyi Seç</div>
                <div class="word-choice-buttons">
                    <button class="btn btn-primary" id="btn-choice-1">Kelime 1</button>
                    <button class="btn btn-primary" id="btn-choice-2">Kelime 2</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="drawing-board" width="800" height="450"></canvas>
            </div>

            <div class="toolbar">
                <div class="color-picker" id="color-picker">
                    <div class="color-swatch active" style="background: #000000;" data-color="#000000"></div>
                    <div class="color-swatch" style="background: #e74c3c;" data-color="#e74c3c"></div>
                    <div class="color-swatch" style="background: #3498db;" data-color="#3498db"></div>
                    <div class="color-swatch" style="background: #2ecc71;" data-color="#2ecc71"></div>
                    <div class="color-swatch" style="background: #f1c40f;" data-color="#f1c40f"></div>
                    <div class="color-swatch" style="background: #9b59b6;" data-color="#9b59b6"></div>
                    <div class="color-swatch" style="background: #ffffff; border: 1px solid #ddd;" data-color="#ffffff"></div> <!-- Eraser essentially -->
                    <div class="color-swatch custom-color-btn" style="background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); display: flex; align-items: center; justify-content: center; position: relative;" data-color="#ff0000" title="Özel Renk">
                        <span style="color: white; font-weight: bold; pointer-events: none; text-shadow: 0 0 2px black;">+</span>
                        <input type="color" class="custom-color-input" value="#ff0000" style="opacity: 0; position: absolute; width: 100%; height: 100%; cursor: pointer;">
                    </div>
                </div>

                <div class="size-picker" id="size-picker">
                    <div class="size-btn" data-size="3"><div class="size-dot" style="width: 4px; height: 4px;"></div></div>
                    <div class="size-btn active" data-size="8"><div class="size-dot" style="width: 8px; height: 8px;"></div></div>
                    <div class="size-btn" data-size="15"><div class="size-dot" style="width: 14px; height: 14px;"></div></div>
                    <div class="size-btn" data-size="25"><div class="size-dot" style="width: 20px; height: 20px;"></div></div>
                </div>

                <div class="tool-picker" id="tool-picker" style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary btn-sm btn-icon tool-btn active" data-tool="brush" title="Fırça" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2l4 4-10 10H8v-4L18 2z"></path><path d="M14 6l4 4"></path><path d="M3 21h18"></path></svg>
                    </button>
                    <button class="btn btn-secondary btn-sm btn-icon tool-btn" data-tool="fill" title="Doldur" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11l-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0L19 11Z"></path><path d="M5 2l5 5"></path><path d="M2 13h15"></path><path d="M22 20a2 2 0 1 1-4 0c0-1.6 2-5 2-5s2 3.4 2 5Z"></path></svg>
                    </button>
                    <button class="btn btn-secondary btn-sm btn-icon tool-btn" data-tool="rect" title="Kare" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                    </button>
                    <button class="btn btn-secondary btn-sm btn-icon tool-btn" data-tool="circle" title="Daire" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
                    </button>
                    <button class="btn btn-secondary btn-sm btn-icon tool-btn" data-tool="line" title="Çizgi" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </div>

                <div class="tools" style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary btn-sm btn-icon" id="btn-undo" title="Geri Al" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
                    </button>
                    <button class="btn btn-secondary btn-sm btn-icon" id="btn-clear" title="Temizle" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                    <button class="btn btn-primary btn-sm" id="btn-skip" style="display: flex; align-items: center; justify-content: center;">Pas Geç</button>
                    <button class="btn btn-success btn-sm" id="btn-next" style="display: none; align-items: center; justify-content: center;">Sonraki</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">Canlı Tahminler (<span id="channel-name-display"></span>)</div>
            <div class="chat-feed custom-scrollbar" id="chat-feed"></div>

            <div class="leaderboard">
                <div class="sidebar-header">Sıralama</div>
                <div class="leaderboard-list custom-scrollbar" id="leaderboard-list"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/shared.js"></script>
    <script src="../shared/drawing.js"></script>
    <script src="../shared/chat.js"></script>
    <script src="../shared/cizbil_words.js"></script>
    <script src="game.js" type="module"></script>
</body>
</html>
