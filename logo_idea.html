<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paira Games Logo Idea</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0816;
            --bg-navy: #151236;
            --primary-purple: #8a2be2;
            --neon-purple: #b266ff;
            --lilac: #d8b4fe;
            --text-main: #f8f9fa;
            --header-bg: rgba(138, 43, 226, 0.2);
            --modal-bg: rgba(21, 18, 54, 0.95);
            --toast-bg: rgba(21, 18, 54, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top left, var(--bg-navy), var(--bg-deep) 80%);
            font-family: 'Poppins', sans-serif;
        }

        .logo-container {
            padding: 20px;
        }

        .taboo-card {
            background: linear-gradient(145deg, var(--modal-bg), #1a1640);
            border: 3px solid var(--neon-purple);
            border-radius: 20px;
            width: 320px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(138, 43, 226, 0.3);
            overflow: hidden;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .card-header {
            background: var(--header-bg);
            padding: 20px;
            border-bottom: 2px solid var(--primary-purple);
        }

        .card-header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin: 0;
            letter-spacing: 1px;
            font-weight: 800;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--lilac), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .forbidden-words {
            list-style: none;
            padding: 25px;
            margin: 0;
        }

        .forbidden-words li {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--lilac);
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .forbidden-words li:last-child {
            margin-bottom: 0;
        }

        .card-footer {
            padding: 10px;
            font-size: 0.7rem;
            color: var(--primary-purple);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            border-top: 1px solid rgba(138, 43, 226, 0.1);
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="taboo-card">
            <div class="card-header">
                <h1>Paira Games</h1>
            </div>
            <ul class="forbidden-words">
                <li>tarayıcı oyunları</li>
                <li>indirmeden</li>
                <li>eğlence</li>
            </ul>
            <div class="card-footer">
                Tabu Kartı Logosu
            </div>
        </div>
    </div>
</body>
</html>
