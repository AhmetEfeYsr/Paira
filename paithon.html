<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paithon Kedi Sayacı</title>
  <!-- Non-blocking rounded display & body fonts with clean system fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fur-light: #fbf7f2;
      --fur-mid: #efe6da;
      --fur-shade: #dfcfbc;
      --ink-espresso: #3a2e2a;
      --rose-nose: #c97a8e;
      --rose-blush: #e49aa9;
      --board-top: #272025;
      --board-bot: #1f1a1d;
      --lilac-border: rgba(196, 181, 253, 0.5);
      --lilac-tag: #ddd6fe;
      --lilac-accent: #c084fc;
      --purple-live: #a855f7;
      --font-display: 'Fredoka', 'Nunito', ui-rounded, 'SF Pro Rounded', 'Segoe UI', sans-serif;
      --font-body: 'Nunito', 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    /* 100% transparent background for OBS Browser Source */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: var(--font-body);
      color: #fffdf9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .overlay-root {
      position: relative;
      width: 384px;
      max-width: 95vw;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2px 0 8px;
    }

    /* ==================== CAT HEAD, PARTY HAT & ANIMATIONS ==================== */
    .cat-head-wrap {
      position: relative;
      width: 96%;
      z-index: 3;
      filter: drop-shadow(0 12px 18px rgba(15, 10, 16, 0.44));
      animation: catBreathe 5.4s ease-in-out infinite;
      transition: filter 0.35s ease;
    }

    .cat-head-wrap.glow-latte {
      filter: drop-shadow(0 0 18px rgba(217, 173, 127, 0.56)) drop-shadow(0 12px 18px rgba(15, 10, 16, 0.44));
    }

    .cat-head-wrap.glow-dollar {
      filter: drop-shadow(0 0 22px rgba(52, 211, 153, 0.58)) drop-shadow(0 12px 18px rgba(15, 10, 16, 0.44));
    }

    .cat-head-wrap.glow-gold {
      filter: drop-shadow(0 0 26px rgba(251, 191, 36, 0.72)) drop-shadow(0 12px 18px rgba(15, 10, 16, 0.44));
    }

    .cat-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    @keyframes catBreathe {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-2.5px) scale(1.006); }
    }

    /* Party hat gentle sparkle & cheerful bounce on donation */
    @keyframes hatSparkleTwinkle {
      0%, 70%, 100% { opacity: 0.18; transform: scale(0.72) rotate(0deg); }
      82% { opacity: 1; transform: scale(1.18) rotate(20deg); }
      92% { opacity: 0.28; transform: scale(0.86) rotate(40deg); }
    }

    @keyframes hatBobExcited {
      0%, 100% { transform: translate(200px, 88px) rotate(-7deg); }
      50% { transform: translate(200px, 82px) rotate(-2.5deg); }
    }

    .party-hat-group {
      transform: translate(200px, 88px) rotate(-7deg);
      transition: transform 0.3s ease;
    }

    .overlay-root.is-excited .party-hat-group {
      animation: hatBobExcited 0.52s ease-in-out infinite;
    }

    .hat-sparkle {
      transform-origin: 18px -69px;
      animation: hatSparkleTwinkle 4.2s ease-in-out infinite;
    }

    /* Ear twitches */
    @keyframes earTwitchL {
      0%, 87%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-6deg); }
      94% { transform: rotate(2deg); }
      97% { transform: rotate(-1.5deg); }
    }

    @keyframes earTwitchR {
      0%, 81%, 100% { transform: rotate(0deg); }
      84% { transform: rotate(5.8deg); }
      88% { transform: rotate(-2deg); }
      92% { transform: rotate(1.5deg); }
    }

    @keyframes earExcitedL {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-7.5deg); }
      50% { transform: rotate(2.5deg); }
      75% { transform: rotate(-4.5deg); }
    }

    @keyframes earExcitedR {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(7.5deg); }
      50% { transform: rotate(-2.5deg); }
      75% { transform: rotate(4.5deg); }
    }

    .ear-left {
      transform-origin: 108px 136px;
      animation: earTwitchL 7.6s ease-in-out infinite;
    }

    .ear-right {
      transform-origin: 292px 136px;
      animation: earTwitchR 9.2s ease-in-out infinite;
    }

    .overlay-root.is-excited .ear-left {
      animation: earExcitedL 0.48s ease-in-out infinite;
    }

    .overlay-root.is-excited .ear-right {
      animation: earExcitedR 0.48s ease-in-out infinite;
    }

    /* Natural idle blinking */
    @keyframes eyeBlink {
      0%, 90%, 100% { transform: scaleY(0); }
      94.5% { transform: scaleY(1); }
      98.5% { transform: scaleY(0); }
    }

    .eyelid-left {
      transform-origin: 130px 142px;
      transform: scaleY(0);
      animation: eyeBlink 5.2s ease-in-out infinite;
    }

    .eyelid-right {
      transform-origin: 270px 142px;
      transform: scaleY(0);
      animation: eyeBlink 5.2s ease-in-out infinite;
    }

    .eye-group.slot-active .eyelid-left,
    .eye-group.slot-active .eyelid-right {
      animation: none;
      transform: scaleY(0);
    }

    .idle-eye-content {
      transition: opacity 0.24s ease;
      opacity: 1;
    }

    .eye-group.slot-active .idle-eye-content {
      opacity: 0;
    }

    .slot-eye-content {
      transition: opacity 0.24s ease;
      opacity: 0;
    }

    .eye-group.slot-active .slot-eye-content {
      opacity: 1;
    }

    .eye-ring {
      transition: stroke 0.28s ease;
    }

    .eye-group.tier-latte .eye-ring { stroke: #deb88f; }
    .eye-group.tier-dollar .eye-ring { stroke: #34d399; }
    .eye-group.tier-gold .eye-ring { stroke: #fbbf24; }

    /* Satisfying lock-in bounce when each slot eye lands */
    @keyframes eyeLockPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    #leftEyeGroup { transform-origin: 130px 180px; }
    #rightEyeGroup { transform-origin: 270px 180px; }

    .eye-group.pop-lock {
      animation: eyeLockPop 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ==================== PAWS & HIGH-READABILITY BOARD ==================== */
    .board-wrap {
      position: relative;
      width: 100%;
      margin-top: -22px;
      z-index: 6;
    }

    .paw {
      position: absolute;
      top: -21px;
      width: 68px;
      height: 52px;
      z-index: 12;
      filter: drop-shadow(0 5px 7px rgba(10, 6, 12, 0.52));
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .paw-left {
      left: 20px;
      transform: rotate(-5deg);
    }

    .paw-right {
      right: 20px;
      transform: rotate(5deg);
    }

    .overlay-root.is-excited .paw-left {
      transform: rotate(-10deg) translateY(-3px);
    }

    .overlay-root.is-excited .paw-right {
      transform: rotate(10deg) translateY(-3px);
    }

    .board-card {
      position: relative;
      background: linear-gradient(168deg, var(--board-top) 0%, var(--board-bot) 100%);
      border: 2px solid var(--lilac-border);
      border-radius: 26px;
      padding: 24px 15px 15px;
      box-shadow:
        0 18px 34px rgba(8, 5, 11, 0.65),
        0 0 0 1px rgba(18, 13, 20, 0.9),
        inset 0 1.5px 0 rgba(233, 213, 255, 0.18);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .board-card.pulse-add {
      border-color: rgba(216, 180, 254, 0.92);
      box-shadow:
        0 18px 34px rgba(8, 5, 11, 0.65),
        0 0 24px rgba(168, 85, 247, 0.4),
        inset 0 1.5px 0 rgba(243, 232, 255, 0.3);
    }

    /* Floating +MM:SS popup over the timer */
    .popup-layer {
      position: absolute;
      inset: 0 0 auto 0;
      height: 48px;
      pointer-events: none;
      z-index: 25;
    }

    @keyframes floatUpPopup {
      0% {
        opacity: 0;
        transform: translate(-50%, 10px) scale(0.82);
      }
      18% {
        opacity: 1;
        transform: translate(-50%, -8px) scale(1.06);
      }
      76% {
        opacity: 1;
        transform: translate(-50%, -24px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -38px) scale(0.95);
      }
    }

    .time-popup {
      position: absolute;
      left: 50%;
      top: 8px;
      padding: 4px 15px;
      border-radius: 999px;
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
      animation: floatUpPopup 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .time-popup.tier-latte {
      background: rgba(34, 26, 38, 0.97);
      border: 1.5px solid rgba(216, 180, 254, 0.85);
      color: #f5f3ff;
      text-shadow: 0 1px 6px rgba(168, 85, 247, 0.48);
    }

    .time-popup.tier-dollar {
      background: rgba(15, 38, 30, 0.97);
      border: 1.5px solid rgba(52, 211, 153, 0.85);
      color: #a7f3d0;
      text-shadow: 0 1px 6px rgba(16, 185, 129, 0.45);
    }

    .time-popup.tier-gold {
      background: rgba(46, 34, 16, 0.97);
      border: 1.5px solid rgba(251, 191, 36, 0.9);
      color: #fef08a;
      text-shadow: 0 1px 6px rgba(245, 158, 11, 0.5);
    }

    /* Main Timer Container (High-Contrast for small stream corner scaling) */
    .timer-box {
      border-radius: 18px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      background: linear-gradient(180deg, rgba(16, 13, 16, 0.94) 0%, rgba(23, 18, 22, 0.92) 100%);
      padding: 11px 10px 13px;
      text-align: center;
      box-shadow: inset 0 3px 12px rgba(4, 2, 6, 0.78);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 4px;
    }

    /* Glowing Pulsing Purple Live Dot (#A855F7) */
    .live-dot {
      position: relative;
      display: inline-flex;
      width: 11px;
      height: 11px;
      align-items: center;
      justify-content: center;
    }

    @keyframes livePulse {
      0% { transform: scale(0.95); opacity: 0.9; }
      70% { transform: scale(2.4); opacity: 0; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .live-dot-halo {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--purple-live);
      animation: livePulse 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    .live-dot-core {
      position: relative;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--purple-live);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.95);
    }

    .title-text {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fbf7f2;
      text-shadow: 0 1px 6px rgba(168, 85, 247, 0.32);
    }

    .timer-value {
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      font-size: 54px;
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: 0.04em;
      color: #fffdf9;
      text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.72),
        0 0 18px rgba(216, 180, 254, 0.18);
    }

    /* Subtle Lilac Divider */
    .divider-bar {
      height: 1.5px;
      margin: 12px 6px;
      background: linear-gradient(90deg, transparent 0%, rgba(196, 181, 253, 0.48) 50%, transparent 100%);
      border-radius: 999px;
    }

    /* Compact High-Contrast 3-Column Price Table */
    .price-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .price-cell {
      border-radius: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.11);
      background: rgba(255, 255, 255, 0.045);
      padding: 8px 4px 9px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .price-amount {
      font-family: var(--font-body);
      font-size: 14.5px;
      font-weight: 900;
      line-height: 1.2;
      color: #fbf7f2;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }

    .price-duration {
      margin-top: 3px;
      font-family: var(--font-display);
      font-size: 16.5px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--lilac-tag);
      text-shadow: 0 1px 8px rgba(168, 85, 247, 0.36);
      white-space: nowrap;
    }

    @media (max-width: 370px) {
      .timer-value {
        font-size: 44px;
      }
      .price-amount {
        font-size: 12.5px;
      }
      .price-duration {
        font-size: 14.5px;
      }
    }
  </style>
</head>
<body tabindex="0">
  <main id="overlayRoot" class="overlay-root">
    <!-- 1. COZY PARTY-HAT CAT HEAD + SLOT MACHINE EYES -->
    <div id="catHeadWrap" class="cat-head-wrap">
      <svg class="cat-svg" viewBox="0 0 400 302" aria-label="Paithon Kedi Sayacı">
        <defs>
          <!-- Warm Cream-Beige Fur (#FBF7F2 to #EFE6DA) -->
          <radialGradient id="gradFur" cx="50%" cy="32%" r="68%">
            <stop offset="0%" stop-color="#fbf7f2" />
            <stop offset="68%" stop-color="#efe6da" />
            <stop offset="100%" stop-color="#dfcfbc" />
          </radialGradient>

          <!-- Soft Chin Shading -->
          <linearGradient id="gradChinSoft" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#dfcfbc" stop-opacity="0" />
            <stop offset="100%" stop-color="#cfbda7" stop-opacity="0.44" />
          </linearGradient>

          <!-- Soft Dusty Rose Inner Ear -->
          <linearGradient id="gradEarInner" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#efc1cc" />
            <stop offset="100%" stop-color="#dd99a9" />
          </linearGradient>

          <!-- Puffy Blush Cheek -->
          <radialGradient id="gradBlush" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e49aa9" stop-opacity="0.58" />
            <stop offset="100%" stop-color="#e49aa9" stop-opacity="0" />
          </radialGradient>

          <!-- Party Hat Gradients (Soft Lilac, Warm Cream, Antique Gold Trim) -->
          <linearGradient id="gradHatBase" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffdf9" />
            <stop offset="55%" stop-color="#f5ede3" />
            <stop offset="100%" stop-color="#e6dacd" />
          </linearGradient>
          <linearGradient id="gradHatStripe" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d8b4fe" />
            <stop offset="55%" stop-color="#c4b5fd" />
            <stop offset="100%" stop-color="#a78bfa" />
          </linearGradient>
          <linearGradient id="gradHatShade" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
            <stop offset="52%" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="100%" stop-color="#3a2e2a" stop-opacity="0.18" />
          </linearGradient>
          <linearGradient id="gradHatTrimGold" x1="0%" y1="0%" x2="0%" y2="100%">

            <stop offset="55%" stop-color="#dfb155" />
            <stop offset="100%" stop-color="#b9862c" />
          </linearGradient>
          <radialGradient id="gradPomPom" cx="38%" cy="32%" r="68%">
            <stop offset="0%" stop-color="#fffdf9" />
            <stop offset="58%" stop-color="#f3e8ff" />
            <stop offset="100%" stop-color="#d8b4fe" />
          </radialGradient>

          <!-- Party Hat Cone Clip Path -->
          <clipPath id="clipPartyHat">
            <path d="M -30 4 L 0 -63 L 30 4 Q 0 13, -30 4 Z" />
          </clipPath>

          <!-- Glossy Warm Espresso-Amber Idle Cat Eyes -->
          <radialGradient id="gradSocket" cx="50%" cy="38%" r="62%">

            <stop offset="100%" stop-color="#17100d" />
          </radialGradient>
          <radialGradient id="gradIris" cx="44%" cy="36%" r="64%">
            <stop offset="0%" stop-color="#6b4733" />
            <stop offset="58%" stop-color="#2c1c14" />
            <stop offset="100%" stop-color="#140c09" />
          </radialGradient>
          <linearGradient id="gradAmberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#c88d59" stop-opacity="0" />
            <stop offset="100%" stop-color="#d89b62" stop-opacity="0.62" />
          </linearGradient>

          <!-- Thin Espresso Collar -->
          <linearGradient id="gradCollar" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3a2e2a" />
            <stop offset="50%" stop-color="#53424b" />
            <stop offset="100%" stop-color="#3a2e2a" />
          </linearGradient>

          <!-- Glass Eye Sheen -->
          <linearGradient id="gradEyeSheen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
            <stop offset="48%" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="100%" stop-color="#140b10" stop-opacity="0.22" />
          </linearGradient>

          <!-- Slot Icon Gradients (Unique shared IDs) -->
          <linearGradient id="gradBillBack" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#047857" />
          </linearGradient>
          <linearGradient id="gradBillFront" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="55%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#059669" />
          </linearGradient>
          <linearGradient id="gradGoldFront" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fde047" />
            <stop offset="55%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#b45309" />
          </linearGradient>
          <linearGradient id="gradGoldTop" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fef9c3" />
            <stop offset="100%" stop-color="#fbbf24" />
          </linearGradient>

          <!-- Subtle Vertical Motion Blur During Slot Spin -->
          <filter id="slotMotionBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="0 2.8" />
          </filter>

          <!-- Unique Left & Right Eye Clip Paths -->
          <clipPath id="clipEyeLeft">
            <circle cx="130" cy="180" r="35.5" />
          </clipPath>
          <clipPath id="clipEyeRight">
            <circle cx="270" cy="180" r="35.5" />
          </clipPath>

          <!-- Shared Slot Machine SVG Icons (Centered at 0,0) -->

            <ellipse cx="-1" cy="-9.5" rx="15" ry="4.6" fill="#b7794a" />
            <path d="M -1 -7.2 C -5 -10.2, -5 -12.4, -2.5 -11.9 C -1.5 -11.6, -1 -10.6, -1 -10.6 C -1 -10.6, -0.5 -11.6, 0.5 -11.9 C 3 -12.4, 3 -10.2, -1 -7.2 Z" fill="#fff7ee" />
            <ellipse cx="-1" cy="23.5" rx="18" ry="3.4" fill="#d9c8b8" />

          <!-- 10-60 min: Crisp Dollar Bill Icon -->
          <g id="iconDollar">
            <!-- Subtle stacked back bill -->
            <rect x="-22" y="-17" width="46" height="28" rx="4.5" transform="rotate(-14)" fill="url(#gradBillBack)" stroke="#6ee7b7" stroke-width="1.6" opacity="0.82" />
            <!-- Main crisp green banknote -->
            <g transform="rotate(-6)">
              <rect x="-24" y="-14.5" width="48" height="29" rx="4.8" fill="url(#gradBillFront)" stroke="#d1fae5" stroke-width="2.2" />
              <rect x="-19.5" y="-10" width="39" height="20" rx="2.6" fill="none" stroke="#a7f3d0" stroke-width="1.3" opacity="0.9" />
              <circle cx="-15" cy="-6" r="1.5" fill="#d1fae5" />

  <script>
    (function () {

      // ==================== CONFIGURATION ====================
      // Supported URL params: ?token=STREAMLABS_TOKEN&minutes=120&reset=1

        initialMinutes: 120,
        streamlabsToken: '',
        storageKey: 'paithon_cat_timer_v4',
        rates: {
          tryPerMinute: 10,    // 10 TRY = +1 dk (6 sec / TRY)
          kicksPerMinute: 100, // 100 Kicks = +1 dk (0.6 sec / Kick)
          subMinutes: 5        // 1 Sub = +5 dk (300 sec / Sub)
        },
        eyeHoldDurationMs: 6000,
        queuedHoldDurationMs: 2500,
        maxSeenEvents: 500
      };

      const SVG_NS = 'http://www.w3.org/2000/svg';
      const EYE_STEP_PX = 82;
      const LEFT_EYE_CENTER = { x: 130, y: 180 };
      const RIGHT_EYE_CENTER = { x: 270, y: 180 };

      // ==================== STATE ====================
      let targetEndTimestamp = 0;
      let lastRenderedSecond = -1;
      let streamlabsSocket = null;
      const seenEventIds = new Set();
      const eyeQueue = [];
      let isSpinningEyes = false;
      let activeHoldTimer = null;
      let activeHoldDone = null;

      // ==================== DOM REFERENCES ====================
      const els = {
        overlayRoot: document.getElementById('overlayRoot'),
        catHeadWrap: document.getElementById('catHeadWrap'),
        leftEyeGroup: document.getElementById('leftEyeGroup'),
        rightEyeGroup: document.getElementById('rightEyeGroup'),
        leftReelTrack: document.getElementById('leftReelTrack'),
        rightReelTrack: document.getElementById('rightReelTrack'),
        boardCard: document.getElementById('boardCard'),
        popupLayer: document.getElementById('popupLayer'),
        timerDisplay: document.getElementById('timerDisplay'),
        priceTryLabel: document.getElementById('priceTryLabel'),
        priceTryTime: document.getElementById('priceTryTime'),
        priceKicksLabel: document.getElementById('priceKicksLabel'),
        priceKicksTime: document.getElementById('priceKicksTime'),
        priceSubLabel: document.getElementById('priceSubLabel'),
        priceSubTime: document.getElementById('priceSubTime')
      };

      // ==================== SAFE LOCALSTORAGE PERSISTENCE ====================
      function safeGetStorage(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (err) {
          return null;
        }
      }

      function safeSetStorage(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch (err) {
          // Silently continue in restricted OBS/iframe contexts
        }
      }

      function safeRemoveStorage(key) {
        try {
          window.localStorage.removeItem(key);
        } catch (err) {
          // Ignore storage removal errors
        }
      }

      function getRemainingMs() {
        return Math.max(0, targetEndTimestamp - Date.now());
      }

      function saveTimerState() {
        safeSetStorage(CONFIG.storageKey, JSON.stringify({
          targetEndTimestamp: targetEndTimestamp,
          remainingMs: getRemainingMs(),
          savedAt: Date.now()
        }));
      }

      function loadSavedRemainingMs() {
        const raw = safeGetStorage(CONFIG.storageKey);
        if (!raw) return null;
        try {
          const parsed = JSON.parse(raw);
          if (parsed && Number.isFinite(parsed.targetEndTimestamp)) {
            return Math.max(0, parsed.targetEndTimestamp - Date.now());
          }
          if (parsed && Number.isFinite(parsed.remainingMs)) {
            return Math.max(0, parsed.remainingMs);
          }
        } catch (err) {
          return null;
        }
        return null;
      }

      // ==================== SAFE NUMBER PARSING & TIME FORMATTING ====================
      function parseNumericAmount(value) {
        if (typeof value === 'number') {
          return Number.isFinite(value) ? value : NaN;
        }
        if (typeof value !== 'string') return NaN;

        const cleaned = value.trim().replace(/[^\d.,-]/g, '');
        if (!cleaned) return NaN;

        const lastComma = cleaned.lastIndexOf(',');
        const lastDot = cleaned.lastIndexOf('.');
        let normalized = cleaned;

        if (lastComma > -1 && lastDot > -1) {
          if (lastComma > lastDot) {
            // e.g. "1.250,50" -> "1250.50"
            normalized = cleaned.replace(/\./g, '').replace(',', '.');
          } else {
            // e.g. "1,250.50" -> "1250.50"
            normalized = cleaned.replace(/,/g, '');
          }
        } else if (lastComma > -1) {
          const decimals = cleaned.length - lastComma - 1;
          normalized = decimals === 3 ? cleaned.replace(/,/g, '') : cleaned.replace(',', '.');
        }

        const num = parseFloat(normalized);
        return Number.isFinite(num) ? num : NaN;
      }

      function formatClock(totalSeconds) {
        const clamped = Math.max(0, Math.floor(totalSeconds));
        const hrs = Math.floor(clamped / 3600);
        const mins = Math.floor((clamped % 3600) / 60);
        const secs = clamped % 60;
        return (
          String(hrs).padStart(2, '0') + ':' +
          String(mins).padStart(2, '0') + ':' +
          String(secs).padStart(2, '0')
        );
      }

      function formatPopupDuration(totalSeconds) {
        const sec = Math.max(0, Math.round(totalSeconds));
        const hrs = Math.floor(sec / 3600);
        const mins = Math.floor((sec % 3600) / 60);
        const remSecs = sec % 60;
        if (hrs > 0) {
          return '+' + hrs + ':' + String(mins).padStart(2, '0') + ':' + String(remSecs).padStart(2, '0');
        }
        return '+' + String(mins).padStart(2, '0') + ':' + String(remSecs).padStart(2, '0');
      }

      function formatShortMinutes(minutes) {
        const totalSec = Math.round(minutes * 60);
        if (totalSec >= 3600 && totalSec % 3600 === 0) return '+' + (totalSec / 3600) + ' sa';
        if (totalSec >= 60 && totalSec % 60 === 0) return '+' + (totalSec / 60) + ' dk';
        if (totalSec >= 60) return '+' + Math.floor(totalSec / 60) + ' dk ' + (totalSec % 60) + ' sn';
        return '+' + totalSec + ' sn';
      }

      // ==================== UI RENDERING ====================
      function renderTimer(force) {
        const remainingSeconds = Math.ceil(getRemainingMs() / 1000);
        if (!force && remainingSeconds === lastRenderedSecond) return;
        lastRenderedSecond = remainingSeconds;
        els.timerDisplay.textContent = formatClock(remainingSeconds);
      }

      function renderPricingTable() {
        els.priceTryLabel.textContent = CONFIG.rates.tryPerMinute + ' TRY';
        els.priceTryTime.textContent = '+1 dk';

        els.priceKicksLabel.textContent = CONFIG.rates.kicksPerMinute + ' Kicks';
        els.priceKicksTime.textContent = '+1 dk';

        els.priceSubLabel.textContent = '1 Sub';
        els.priceSubTime.textContent = formatShortMinutes(CONFIG.rates.subMinutes);
      }

      function spawnPopup(addedSeconds, tier) {
        const el = document.createElement('div');
        el.className = 'time-popup tier-' + tier;
        el.textContent = formatPopupDuration(addedSeconds);
        els.popupLayer.appendChild(el);
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 2250);
      }

      function pulseBoard() {
        els.boardCard.classList.remove('pulse-add');
        void els.boardCard.offsetWidth;
        els.boardCard.classList.add('pulse-add');
        setTimeout(function () {
          els.boardCard.classList.remove('pulse-add');
        }, 860);
      }

      function triggerEyeBounce(eyeGroupEl) {
        eyeGroupEl.classList.remove('pop-lock');
        void eyeGroupEl.getBoundingClientRect();
        eyeGroupEl.classList.add('pop-lock');
        setTimeout(function () {
          eyeGroupEl.classList.remove('pop-lock');
        }, 380);
      }

      // ==================== SLOT MACHINE EYE REEL ENGINE ====================
      function getIconHref(tier) {
        if (tier === 'gold') return '#iconGold';
        if (tier === 'dollar') return '#iconDollar';
        return '#iconLatte';
      }

      function populateReel(trackEl, finalTier, totalSteps) {
        while (trackEl.firstChild) {
          trackEl.removeChild(trackEl.firstChild);
        }
        const pool = ['#iconLatte', '#iconDollar', '#iconGold', '#iconSparkle'];
        const finalHref = getIconHref(finalTier);

        for (let i = 0; i <= totalSteps; i++) {
          const href = i === totalSteps ? finalHref : pool[i % pool.length];
          const useEl = document.createElementNS(SVG_NS, 'use');
          useEl.setAttribute('href', href);
          useEl.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', href);
          useEl.setAttribute('x', '0');
          useEl.setAttribute('y', String(i * EYE_STEP_PX));
          trackEl.appendChild(useEl);
        }
      }

      function animateSingleReel(trackEl, eyeCenter, totalSteps, durationMs) {
        return new Promise(function (resolve) {
          const startY = eyeCenter.y;
          const endY = eyeCenter.y - totalSteps * EYE_STEP_PX;
          const distance = endY - startY;
          const startTime = performance.now();

          trackEl.setAttribute('filter', 'url(#slotMotionBlur)');

          function frame(now) {
            const elapsed = now - startTime;
            const t = Math.min(1, elapsed / durationMs);
            const eased = 1 - Math.pow(1 - t, 4.2);
            const currentY = startY + distance * eased;

            trackEl.setAttribute('transform', 'translate(' + eyeCenter.x + ', ' + currentY.toFixed(2) + ')');

            if (t > 0.78 && trackEl.hasAttribute('filter')) {
              trackEl.removeAttribute('filter');
            }

            if (t < 1) {
              requestAnimationFrame(frame);
            } else {
              trackEl.removeAttribute('filter');
              trackEl.setAttribute('transform', 'translate(' + eyeCenter.x + ', ' + endY + ')');
              resolve();
            }
          }

          requestAnimationFrame(frame);
        });
      }

      function waitHold(ms) {
        return new Promise(function (resolve) {
          activeHoldDone = resolve;
          activeHoldTimer = setTimeout(function () {
            activeHoldTimer = null;
            activeHoldDone = null;
            resolve();
          }, ms);
        });
      }

      function shortenActiveHoldIfQueued() {
        if (activeHoldTimer && activeHoldDone) {
          clearTimeout(activeHoldTimer);
          activeHoldTimer = setTimeout(function () {
            const done = activeHoldDone;
            activeHoldTimer = null;
            activeHoldDone = null;
            if (done) done();
          }, 550);
        }
      }

      function clearEyeTierClasses() {
        els.catHeadWrap.classList.remove('glow-latte', 'glow-dollar', 'glow-gold');
        els.leftEyeGroup.classList.remove('tier-latte', 'tier-dollar', 'tier-gold');
        els.rightEyeGroup.classList.remove('tier-latte', 'tier-dollar', 'tier-gold');
      }

      async function processEyeQueue() {
        if (isSpinningEyes) return;
        isSpinningEyes = true;

        try {
          while (eyeQueue.length > 0) {
            const tier = eyeQueue.shift();

            clearEyeTierClasses();
            els.overlayRoot.classList.add('is-excited');
            els.leftEyeGroup.classList.add('slot-active');
            els.rightEyeGroup.classList.add('slot-active');

            const leftSteps = 12;
            const rightSteps = 15;
            populateReel(els.leftReelTrack, tier, leftSteps);
            populateReel(els.rightReelTrack, tier, rightSteps);

            // Left eye locks slightly before right eye
            const leftSpin = animateSingleReel(els.leftReelTrack, LEFT_EYE_CENTER, leftSteps, 1050);
            const rightSpin = animateSingleReel(els.rightReelTrack, RIGHT_EYE_CENTER, rightSteps, 1320);

            await leftSpin;
            els.leftEyeGroup.classList.add('tier-' + tier);
            triggerEyeBounce(els.leftEyeGroup);

            await rightSpin;
            els.rightEyeGroup.classList.add('tier-' + tier);
            els.catHeadWrap.classList.add('glow-' + tier);
            triggerEyeBounce(els.rightEyeGroup);

            const holdMs = eyeQueue.length > 0 ? CONFIG.queuedHoldDurationMs : CONFIG.eyeHoldDurationMs;
            await waitHold(holdMs);
          }
        } finally {
          els.leftEyeGroup.classList.remove('slot-active');
          els.rightEyeGroup.classList.remove('slot-active');
          clearEyeTierClasses();
          els.overlayRoot.classList.remove('is-excited');
          isSpinningEyes = false;
        }
      }

      function enqueueEyeSpin(tier) {
        eyeQueue.push(tier);
        if (isSpinningEyes) {
          shortenActiveHoldIfQueued();
        } else {
          processEyeQueue();
        }
      }

      // ==================== DONATION PROCESSING & SILENT 13x RULE ====================
      function getSecondsPerUnit(currencyType) {
        if (currencyType === 'TRY') {
          return CONFIG.rates.tryPerMinute > 0 ? 60 / CONFIG.rates.tryPerMinute : 0;
        }
        if (currencyType === 'KICKS') {
          return CONFIG.rates.kicksPerMinute > 0 ? 60 / CONFIG.rates.kicksPerMinute : 0;
        }
        if (currencyType === 'SUB') {
          return CONFIG.rates.subMinutes > 0 ? CONFIG.rates.subMinutes * 60 : 0;
        }
        return 0;
      }

      function processDonation(currencyType, rawAmount) {
        const type = String(currencyType || '').toUpperCase();
        const amount = parseNumericAmount(rawAmount);
        if (!Number.isFinite(amount) || amount <= 0) return;

        const secPerUnit = getSecondsPerUnit(type);
        if (!Number.isFinite(secPerUnit) || secPerUnit <= 0) return;

        const baseSeconds = Math.round(amount * secPerUnit);
        // Silently add 13 seconds whenever the donated amount is a positive integer multiple of 13
        const isMultipleOf13 =
          amount > 0 &&
          Math.abs(amount - Math.round(amount)) < 1e-9 &&
          Math.round(amount) % 13 === 0;
        const extraSeconds = isMultipleOf13 ? 13 : 0;
        const totalAddedSeconds = baseSeconds + extraSeconds;

        if (totalAddedSeconds <= 0) return;

        // Drift-free timer update (cleanly resumes if countdown reached 00:00:00)
        const now = Date.now();
        const baseEnd = targetEndTimestamp > now ? targetEndTimestamp : now;
        targetEndTimestamp = baseEnd + totalAddedSeconds * 1000;
        saveTimerState();
        renderTimer(true);

        // Eye tier: 0-10 min (<=600s) Latte | 10-60 min (<=3600s) Dollar | 60+ min (>3600s) Gold
        let tier = 'latte';
        if (totalAddedSeconds > 3600) {
          tier = 'gold';
        } else if (totalAddedSeconds > 600) {
          tier = 'dollar';
        }

        pulseBoard();
        spawnPopup(totalAddedSeconds, tier);
        enqueueEyeSpin(tier);
      }

      // ==================== STREAMLABS SOCKET INTEGRATION ====================
      function isDuplicateEvent(eventId) {
        if (!eventId) return false;
        const key = String(eventId);
        if (seenEventIds.has(key)) return true;
        seenEventIds.add(key);
        if (seenEventIds.size > CONFIG.maxSeenEvents) {
          const oldest = seenEventIds.values().next().value;
          seenEventIds.delete(oldest);
        }
        return false;
      }

      function handleStreamlabsEvent(eventData) {
        if (!eventData || typeof eventData !== 'object') return;
        const type = String(eventData.type || '').toLowerCase();
        const messages = Array.isArray(eventData.message)
          ? eventData.message
          : (eventData.message ? [eventData.message] : []);

        messages.forEach(function (msg) {
          if (!msg || typeof msg !== 'object') return;
          const eventId = msg._id || msg.id || msg.event_id || eventData.event_id;
          if (isDuplicateEvent(eventId)) return;

          // 1. Monetary Donation / Tip (TRY)
          if (type === 'donation' || type === 'tip') {
            const amount = parseNumericAmount(msg.amount != null ? msg.amount : msg.formatted_amount);
            if (Number.isFinite(amount) && amount > 0) {
              processDonation('TRY', amount);
            }
            return;
          }

          // 2. Subscriptions & Gift Subscriptions (Sub)
          if (
            type === 'subscription' ||
            type === 'sub' ||
            type === 'resub' ||
            type === 'gift' ||
            type === 'submysterygift' ||
            type === 'gift_subscription' ||
            type === 'kick_subscription'
          ) {
            const subCount = parseNumericAmount(
              msg.gift_count || msg.mass_gift_count || msg.sub_count || msg.amount || 1
            );
            processDonation('SUB', Number.isFinite(subCount) && subCount > 0 ? subCount : 1);
            return;
          }

          // 3. Kicks / Bits / Cheers
          if (
            type === 'kick' ||
            type === 'kicks' ||
            type === 'kick_gift' ||
            type === 'bits' ||
            type === 'cheer'
          ) {
            const kicksAmount = parseNumericAmount(msg.amount != null ? msg.amount : msg.bits);
            if (Number.isFinite(kicksAmount) && kicksAmount > 0) {
              processDonation('KICKS', kicksAmount);
            }
          }
        });
      }

      // Exposed for console or external payload testing
      window.handleStreamlabsPayload = handleStreamlabsEvent;

      // Dynamically load Socket.IO v2.5.0 ONLY when a Streamlabs token is configured
      function connectStreamlabs(token) {
        if (!token || typeof token !== 'string') return;
        const cleanToken = token.trim();
        if (!cleanToken) return;

        function initSocket() {
          if (typeof window.io !== 'function') return;
          try {
            if (streamlabsSocket) {
              streamlabsSocket.disconnect();
            }
            streamlabsSocket = window.io('https://sockets.streamlabs.com?token=' + encodeURIComponent(cleanToken), {
              transports: ['websocket']
            });
            streamlabsSocket.on('event', handleStreamlabsEvent);
          } catch (err) {
            // Connection failures never interrupt the timer
          }
        }

        if (typeof window.io === 'function') {
          initSocket();
          return;
        }

        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.js';
        script.async = true;
        script.onload = initSocket;
        document.head.appendChild(script);
      }

      // ==================== KEYBOARD TEST SHORTCUTS (1 - 4) ====================
      window.addEventListener('pointerdown', function () {
        if (document.body && typeof document.body.focus === 'function') {
          document.body.focus();
        }
      });

      window.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === '1') {
          processDonation('TRY', 50);     // +05:00 -> Latte eyes
        } else if (e.key === '2') {
          processDonation('SUB', 5);      // +25:00 -> Dollar bill eyes
        } else if (e.key === '3') {
          processDonation('SUB', 15);     // +1:15:00 -> Gold bar eyes
        } else if (e.key === '4') {
          processDonation('TRY', 130);    // +13:13 (with silent 13s) -> Dollar bill eyes
        }
      });

      // ==================== INITIALIZATION ====================
      function startCountdownLoop() {
        function tick() {
          renderTimer(false);
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      function init() {
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get('token');
        const urlMinutes = parseFloat(params.get('minutes'));
        const shouldReset = params.get('reset') === '1' || params.get('reset') === 'true';

        if (shouldReset) {
          safeRemoveStorage(CONFIG.storageKey);
        }

        renderPricingTable();

        const savedRemaining = shouldReset ? null : loadSavedRemainingMs();
        if (Number.isFinite(urlMinutes) && urlMinutes >= 0 && (shouldReset || savedRemaining === null)) {
          targetEndTimestamp = Date.now() + Math.round(urlMinutes * 60 * 1000);
        } else if (savedRemaining !== null) {
          targetEndTimestamp = Date.now() + savedRemaining;
        } else {
          targetEndTimestamp = Date.now() + Math.round(CONFIG.initialMinutes * 60 * 1000);
        }

        saveTimerState();
        renderTimer(true);
        startCountdownLoop();

        const token = urlToken || CONFIG.streamlabsToken;
        if (token) {
          connectStreamlabs(token);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
