<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paithon Kedi Sayacı</title>
    <!-- Rounded high-legibility fonts with clean system fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --fur-light: #fbf7f2;
            --fur-mid: #efe6da;
            --fur-shade: #e5d8c8;
            --ink-espresso: #3a2e2a;
            --rose-nose: #c97a8e;
            --rose-mid: #e5a9b8;
            --rose-soft: #f2c6d0;
            --board-top: #221b1e;
            --board-bot: #171215;
            --lilac-border: rgba(185, 151, 245, 0.55);
            --lilac-border-bright: rgba(216, 180, 254, 0.92);
            --lilac-reward: #dec4ff;
            --purple-live: #a855f7;
            --font-display: 'Fredoka', 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
            --font-body: 'Nunito', 'Fredoka', 'Quicksand', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        /* 100% transparent background for direct OBS Browser Source usage */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: var(--font-body);
            color: #fffdfb;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
            font-optical-sizing: auto;
            font-synthesis: none;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            outline: none;
        }

        /*
      Designed for 1500x600 OBS Browser Source:
      Cat & board anchor to the far right, leaving ~1100px of transparent canvas
      on the left for donation message banners emerging from behind the cat.
    */
        .overlay-shell {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 16px 24px 16px 24px;
            user-select: none;
        }

        /* Board (376px) paired with enlarged cat head (332px) anchored on the far right */
        .overlay-root {
            position: relative;
            width: 376px;
            max-width: calc(100vw - 32px);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ==================== CAT HEAD + ENLARGED PROPORTION + BEHIND-CAT NOTIF ANCHOR ==================== */
        .cat-stage {
            position: relative;
            width: 332px;
            max-width: 92%;
            z-index: 4;
            display: flex;
            justify-content: center;
        }

        .cat-head-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            filter: drop-shadow(0 10px 16px rgba(14, 9, 14, 0.44));
            animation: catBreathe 5.4s ease-in-out infinite;
            transition: filter 0.35s ease;
        }

        .cat-head-wrap.glow-latte {
            filter: drop-shadow(0 0 18px rgba(217, 173, 127, 0.56)) drop-shadow(0 10px 16px rgba(14, 9, 14, 0.44));
        }

        .cat-head-wrap.glow-dollar {
            filter: drop-shadow(0 0 22px rgba(52, 211, 153, 0.58)) drop-shadow(0 10px 16px rgba(14, 9, 14, 0.44));
        }

        .cat-head-wrap.glow-gold {
            filter: drop-shadow(0 0 26px rgba(251, 191, 36, 0.74)) drop-shadow(0 10px 16px rgba(14, 9, 14, 0.44));
        }

        .cat-svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        @keyframes catBreathe {

            0%,
            100% {
                transform: translateY(0px) scale(1);
            }

            50% {
                transform: translateY(-2px) scale(1.006);
            }
        }

        /* ==================== BEHIND-CAT LEFT-EXTENDING DONATE RIBBON + +13 SN BADGE ==================== */
        .side-notif-stack {
            position: absolute;
            right: 50%;
            top: 60%;
            transform: translateY(-50%);
            width: min(1270px, calc(100vw - 210px));
            padding: 40px 0 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 18px;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        @keyframes badgeSpringPop {
            0% {
                opacity: 0;
                transform: scale(0.25) rotate(-14deg) translateY(6px);
            }

            58% {
                opacity: 1;
                transform: scale(1.16) rotate(5deg) translateY(-2px);
            }

            80% {
                opacity: 1;
                transform: scale(0.95) rotate(-2deg) translateY(0px);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(3deg) translateY(0px);
            }
        }

        .side-notif {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 26px;
            width: fit-content;
            max-width: 100%;
            min-width: 340px;
            padding: 24px 176px 24px 36px;
            border-radius: 32px 0 0 32px;
            background: linear-gradient(155deg, #241c21 0%, #161116 100%);
            border: 2px solid rgba(185, 151, 245, 0.84);
            border-right: none;
            box-shadow:
                -8px 12px 26px rgba(8, 5, 11, 0.68),
                0 0 20px rgba(168, 85, 247, 0.24),
                inset 0 1.5px 0 rgba(255, 255, 255, 0.14);
            color: #fffdfb;
            will-change: transform, opacity;
            transform: translate3d(100%, 0, 0);
            opacity: 0;
            transition:
                transform 680ms cubic-bezier(0.16, 1, 0.3, 1),
                opacity 420ms ease-out;
        }

        .side-notif.is-visible {
            transform: translate3d(0px, 0, 0);
            opacity: 1;
        }

        .side-notif.is-exiting {
            transform: translate3d(100%, 0, 0);
            opacity: 0;
            transition:
                transform 1350ms cubic-bezier(0.42, 0, 0.2, 1),
                opacity 1150ms ease-in 200ms;
        }

        .notif-body {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            text-align: right;
            min-width: 0;
            max-width: 960px;
            gap: 8px;
        }

        .notif-meta {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            max-width: 100%;
        }

        .notif-donor {
            font-family: var(--font-display);
            font-size: 37px;
            font-weight: 700;
            line-height: 1.15;
            color: #fffdfb;
            letter-spacing: 0.015em;
            text-shadow:
                0 0 0.8px rgba(255, 253, 251, 0.24),
                0 2px 8px rgba(0, 0, 0, 0.65);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 560px;
        }

        .notif-dot {
            color: rgba(222, 196, 255, 0.55);
            font-size: 26px;
            line-height: 1;
            flex-shrink: 0;
        }

        .notif-amount {
            font-family: var(--font-body);
            font-size: 33px;
            font-weight: 900;
            line-height: 1.15;
            color: var(--lilac-reward);
            letter-spacing: 0.01em;
            text-shadow:
                0 0 0.8px rgba(222, 196, 255, 0.28),
                0 1px 8px rgba(168, 85, 247, 0.38);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .notif-message {
            font-family: var(--font-body);
            font-size: 36px;
            font-weight: 800;
            line-height: 1.26;
            color: #f4ecf7;
            letter-spacing: 0.005em;
            text-shadow:
                0 0 0.8px rgba(244, 236, 247, 0.24),
                0 2px 8px rgba(0, 0, 0, 0.72);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        .notif-time-wrap {
            position: relative;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .notif-duration {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 148px;
            padding: 15px 24px;
            border-radius: 22px;
            background: #120d13;
            border: 1.5px solid rgba(185, 151, 245, 0.62);
            box-shadow: inset 0 2px 8px rgba(4, 2, 6, 0.75);
            font-family: var(--font-display);
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum" 1;
            font-size: 44px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.02em;
            color: var(--lilac-reward);
            text-shadow:
                0 0 1px rgba(222, 196, 255, 0.35),
                0 2px 10px rgba(0, 0, 0, 0.75),
                0 0 16px rgba(168, 85, 247, 0.48);
            white-space: nowrap;
        }

        .notif-duration.is-long {
            font-size: 34px;
            padding: 13px 18px;
        }

        .side-notif.tier-latte {
            border-color: rgba(216, 180, 254, 0.86);
            box-shadow:
                -8px 12px 26px rgba(8, 5, 11, 0.68),
                0 0 20px rgba(185, 151, 245, 0.3),
                inset 0 1.5px 0 rgba(255, 255, 255, 0.16);
        }

        .side-notif.tier-dollar {
            border-color: rgba(52, 211, 153, 0.88);
            box-shadow:
                -8px 12px 26px rgba(8, 5, 11, 0.68),
                0 0 22px rgba(16, 185, 129, 0.34),
                inset 0 1.5px 0 rgba(209, 250, 229, 0.2);
        }

        .side-notif.tier-dollar .notif-amount,
        .side-notif.tier-dollar .notif-duration {
            color: #a7f3d0;
            border-color: rgba(52, 211, 153, 0.65);
            text-shadow:
                0 0 0.9px rgba(167, 243, 208, 0.32),
                0 2px 8px rgba(0, 0, 0, 0.75),
                0 0 12px rgba(16, 185, 129, 0.42);
        }

        .side-notif.tier-gold {
            border-color: rgba(251, 191, 36, 0.94);
            box-shadow:
                -8px 12px 26px rgba(8, 5, 11, 0.68),
                0 0 26px rgba(245, 158, 11, 0.42),
                inset 0 1.5px 0 rgba(254, 240, 138, 0.25);
        }

        .side-notif.tier-gold .notif-amount,
        .side-notif.tier-gold .notif-duration {
            color: #fef08a;
            border-color: rgba(251, 191, 36, 0.72);
            text-shadow:
                0 0 0.9px rgba(254, 240, 138, 0.35),
                0 2px 8px rgba(0, 0, 0, 0.75),
                0 0 14px rgba(245, 158, 11, 0.48);
        }

        /* Separate +13 sn mini badge pinned to the top-right corner of the duration chip */
        .bonus-badge {
            position: absolute;
            top: -18px;
            right: -12px;
            z-index: 4;
            padding: 5px 14px 6px;
            border-radius: 999px;
            background: linear-gradient(135deg, #f3d285 0%, #c084fc 100%);
            border: 2px solid #fffdf9;
            color: #1f1426;
            font-family: var(--font-display);
            font-variant-numeric: tabular-nums;
            font-size: 22px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.02em;
            white-space: nowrap;
            box-shadow:
                0 5px 12px rgba(28, 12, 42, 0.65),
                0 0 14px rgba(216, 180, 254, 0.6);
            opacity: 0;
            transform-origin: center bottom;
            animation: badgeSpringPop 0.56s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s forwards;
        }

        /* ==================== PARTY HAT, EARS & SLOT EYES ANIMATIONS ==================== */
        @keyframes hatSparkleTwinkle {

            0%,
            70%,
            100% {
                opacity: 0.18;
                transform: scale(0.72) rotate(0deg);
            }

            82% {
                opacity: 1;
                transform: scale(1.18) rotate(20deg);
            }

            92% {
                opacity: 0.28;
                transform: scale(0.86) rotate(40deg);
            }
        }

        @keyframes hatBobExcited {

            0%,
            100% {
                transform: translate(200px, 88px) rotate(-7deg);
            }

            50% {
                transform: translate(200px, 80px) rotate(-1.5deg);
            }
        }

        .party-hat-group {
            transform: translate(200px, 88px) rotate(-7deg);
            transition: transform 0.3s ease;
        }

        .overlay-root.is-excited .party-hat-group {
            animation: hatBobExcited 0.48s ease-in-out infinite;
        }

        .hat-sparkle {
            transform-origin: 18px -69px;
            animation: hatSparkleTwinkle 4.2s ease-in-out infinite;
        }

        @keyframes earTwitchL {

            0%,
            87%,
            100% {
                transform: rotate(0deg);
            }

            90% {
                transform: rotate(-6deg);
            }

            94% {
                transform: rotate(2deg);
            }

            97% {
                transform: rotate(-1.5deg);
            }
        }

        @keyframes earTwitchR {

            0%,
            81%,
            100% {
                transform: rotate(0deg);
            }

            84% {
                transform: rotate(5.8deg);
            }

            88% {
                transform: rotate(-2deg);
            }

            92% {
                transform: rotate(1.5deg);
            }
        }

        @keyframes earExcitedL {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-7.5deg);
            }

            50% {
                transform: rotate(2.5deg);
            }

            75% {
                transform: rotate(-4.5deg);
            }
        }

        @keyframes earExcitedR {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(7.5deg);
            }

            50% {
                transform: rotate(-2.5deg);
            }

            75% {
                transform: rotate(4.5deg);
            }
        }

        .ear-left {
            transform-origin: 108px 136px;
            animation: earTwitchL 7.6s ease-in-out infinite;
        }

        .ear-right {
            transform-origin: 292px 136px;
            animation: earTwitchR 9.2s ease-in-out infinite;
        }

        .overlay-root.is-excited .ear-left {
            animation: earExcitedL 0.48s ease-in-out infinite;
        }

        .overlay-root.is-excited .ear-right {
            animation: earExcitedR 0.48s ease-in-out infinite;
        }

        /* Natural periodic blinking */
        @keyframes eyeBlink {

            0%,
            90%,
            100% {
                transform: scaleY(0);
            }

            94.5% {
                transform: scaleY(1);
            }

            98.5% {
                transform: scaleY(0);
            }
        }

        .eyelid-left {
            transform-origin: 130px 142px;
            transform: scaleY(0);
            animation: eyeBlink 5.2s ease-in-out infinite;
        }

        .eyelid-right {
            transform-origin: 270px 142px;
            transform: scaleY(0);
            animation: eyeBlink 5.2s ease-in-out infinite;
        }

        .eye-group.slot-active .eyelid-left,
        .eye-group.slot-active .eyelid-right {
            animation: none;
            transform: scaleY(0);
        }

        .idle-eye-content {
            transition: opacity 0.24s ease;
            opacity: 1;
        }

        .eye-group.slot-active .idle-eye-content {
            opacity: 0;
        }

        .slot-eye-content {
            transition: opacity 0.24s ease;
            opacity: 0;
        }

        .eye-group.slot-active .slot-eye-content {
            opacity: 1;
        }

        .eye-ring {
            transition: stroke 0.28s ease;
        }

        .eye-group.tier-latte .eye-ring {
            stroke: #deb88f;
        }

        .eye-group.tier-dollar .eye-ring {
            stroke: #34d399;
        }

        .eye-group.tier-gold .eye-ring {
            stroke: #fbbf24;
        }

        @keyframes eyeLockPop {
            0% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        #leftEyeGroup {
            transform-origin: 130px 180px;
        }

        #rightEyeGroup {
            transform-origin: 270px 180px;
        }

        .eye-group.pop-lock {
            animation: eyeLockPop 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ==================== OUTER-CORNER PAWS & ENLARGED HIGH-LEGIBILITY BOARD ==================== */
        .board-wrap {
            position: relative;
            width: 100%;
            margin-top: -16px;
            z-index: 6;
        }

        /* Paws sit at outer top-left / top-right corners so they NEVER overlap PAITHON or digits */
        .paw {
            position: absolute;
            top: -25px;
            width: 64px;
            height: 48px;
            z-index: 12;
            filter: drop-shadow(0 5px 7px rgba(10, 6, 12, 0.52));
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }

        .paw-left {
            left: 12px;
            transform: rotate(-7deg);
        }

        .paw-right {
            right: 12px;
            transform: rotate(7deg);
        }

        .overlay-root.is-excited .paw-left {
            transform: rotate(-12deg) translateY(-3px);
        }

        .overlay-root.is-excited .paw-right {
            transform: rotate(12deg) translateY(-3px);
        }

        .board-card {
            position: relative;
            background: linear-gradient(168deg, var(--board-top) 0%, var(--board-bot) 100%);
            border: 2px solid var(--lilac-border);
            border-radius: 26px;
            padding: 18px 14px 14px;
            box-shadow:
                0 18px 34px rgba(8, 5, 11, 0.68),
                0 0 0 1px rgba(18, 13, 20, 0.92),
                inset 0 1.5px 0 rgba(233, 213, 255, 0.16);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .board-card.pulse-add {
            border-color: var(--lilac-border-bright);
            box-shadow:
                0 18px 34px rgba(8, 5, 11, 0.68),
                0 0 24px rgba(168, 85, 247, 0.42),
                inset 0 1.5px 0 rgba(243, 232, 255, 0.28);
        }

        /* Main Timer Container */
        .timer-box {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            border-radius: 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.09);
            background: linear-gradient(180deg, #100c10 0%, #161115 100%);
            padding: 11px 0 8px;
            text-align: center;
            box-shadow: inset 0 3px 12px rgba(4, 2, 6, 0.8);
        }

        /* Subtle Floating Lilac Cat Paws Behind Countdown */
        .timer-paws-bg {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.92;
            transition: opacity 0.35s ease;
            -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
        }

        .board-card.pulse-add .timer-paws-bg {
            opacity: 1;
        }

        @keyframes pawFloatDrift {
            0% {
                transform: translate3d(0px, 132px, 0) rotate(var(--rot-start, -14deg)) scale(0.86);
                opacity: 0;
            }

            16% {
                opacity: var(--paw-alpha, 0.15);
            }

            50% {
                transform: translate3d(var(--drift-x, 8px), 52px, 0) rotate(var(--rot-mid, 6deg)) scale(1);
                opacity: var(--paw-alpha, 0.15);
            }

            84% {
                opacity: var(--paw-alpha, 0.15);
            }

            100% {
                transform: translate3d(var(--drift-x-end, -5px), -32px, 0) rotate(var(--rot-end, -12deg)) scale(0.92);
                opacity: 0;
            }
        }

        .timer-paw {
            position: absolute;
            top: 0;
            color: var(--lilac-reward);
            opacity: 0;
            will-change: transform, opacity;
            animation: pawFloatDrift var(--paw-dur, 12.5s) ease-in-out var(--paw-delay, 0s) infinite;
        }

        .timer-paw:nth-child(even) {
            color: #c4b5fd;
        }

        .timer-paw.p1 { left: 4%;  width: 28px; height: 28px; --paw-dur: 11.5s; --paw-delay: -1.8s;  --paw-alpha: 0.28; --rot-start: -18deg; --rot-mid: -4deg; --rot-end: -15deg; --drift-x: 8px;  --drift-x-end: -4px; }
        .timer-paw.p2 { left: 15%; width: 22px; height: 22px; --paw-dur: 13.8s; --paw-delay: -7.4s;  --paw-alpha: 0.24; --rot-start: 14deg;  --rot-mid: -2deg; --rot-end: 12deg;  --drift-x: -7px; --drift-x-end: 5px;  }
        .timer-paw.p3 { left: 26%; width: 30px; height: 30px; --paw-dur: 12.4s; --paw-delay: -4.2s;  --paw-alpha: 0.28; --rot-start: -12deg; --rot-mid: 8deg;  --rot-end: -8deg;  --drift-x: 10px; --drift-x-end: -6px; }
        .timer-paw.p4 { left: 38%; width: 23px; height: 23px; --paw-dur: 14.6s; --paw-delay: -10.6s; --paw-alpha: 0.23; --rot-start: 16deg;  --rot-mid: 2deg;  --rot-end: 18deg;  --drift-x: -8px; --drift-x-end: 4px;  }
        .timer-paw.p5 { left: 50%; width: 27px; height: 27px; --paw-dur: 11.8s; --paw-delay: -2.6s;  --paw-alpha: 0.24; --rot-start: -15deg; --rot-mid: 5deg;  --rot-end: -12deg; --drift-x: 7px;  --drift-x-end: -5px; }
        .timer-paw.p6 { left: 62%; width: 32px; height: 32px; --paw-dur: 13.2s; --paw-delay: -8.9s;  --paw-alpha: 0.27; --rot-start: 12deg;  --rot-mid: -6deg; --rot-end: 14deg;  --drift-x: -9px; --drift-x-end: 6px;  }
        .timer-paw.p7 { left: 74%; width: 22px; height: 22px; --paw-dur: 12.0s; --paw-delay: -5.3s;  --paw-alpha: 0.25; --rot-start: -20deg; --rot-mid: -4deg; --rot-end: -16deg; --drift-x: 8px;  --drift-x-end: -4px; }
        .timer-paw.p8 { left: 85%; width: 29px; height: 29px; --paw-dur: 14.2s; --paw-delay: -11.8s; --paw-alpha: 0.28; --rot-start: 15deg;  --rot-mid: -3deg; --rot-end: 12deg;  --drift-x: -8px; --drift-x-end: 5px;  }

            padding: 0 58px;
            margin-bottom: 2px;

        /* Pulsing Purple Live Indicator Dot (#A855F7) */
        .live-dot {
            position: relative;
            display: inline-flex;
            width: 11px;
            height: 11px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
        }

        @keyframes livePulse {
            0% {
                transform: scale(0.95);
                opacity: 0.92;
            }

            70% {
                transform: scale(2.4);
                opacity: 0;
            }

            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }

        .live-dot-halo {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--purple-live);
            animation: livePulse 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }

        .live-dot-core {
            position: relative;
            width: 10px;
            height: 10px;
            border-radius: 50%;

            white-space: nowrap;

        .timer-fit-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 78px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

    <script>
        (function () {
            'use strict';

            // ==================== CONFIGURATION ====================
            // Supported URL params: ?token=STREAMLABS_SOCKET_TOKEN&minutes=120&reset=1
            const CONFIG = {
                initialMinutes: 120,
                streamlabsToken: '',
                storageKey: 'paithon_cat_timer_v6',
                // Exact tariff rates (seconds added per 1 unit)
                secondsPerUnit: {
                    SUB: 1800,  // 1 Sub = 30 dk (1800 sn)
                    TRY: 9,     // 100 TL = 15 dk (900 sn / 100 = 9 sn)
                    KICKS: 3    // 100 Kicks = 5 dk (300 sn / 100 = 3 sn)

                bonusMultiple: 13,
                bonusSeconds: 13,
                // Dynamic donate banner timing (ms)
                notifEnterMs: 680,
                notifExitMs: 1350,
                notifMinHoldMs: 4200,
                notifMaxHoldMs: 12000,
                notifBaseHoldMs: 3000,
                notifMsPerChar: 45,
                notifQueueGapMs: 320,
                maxSeenEvents: 500,
                // Timer auto-fit typography bounds
                timerMaxFontPx: 68,
                timerMinFontPx: 22,
                timerHorizontalMarginPx: 28
            };

            const SVG_NS = 'http://www.w3.org/2000/svg';
            const EYE_STEP_PX = 82;
            const LEFT_EYE_CENTER = { x: 130, y: 180 };
            const RIGHT_EYE_CENTER = { x: 270, y: 180 };

            // ==================== STATE ====================
            let targetEndTimestamp = 0;
            let activeUrlMinutes = null;
            let lastRenderedSecond = -1;
            let lastFormattedLength = -1;
            let streamlabsSocket = null;
            const seenEventIds = new Set();
            const donationQueue = [];
            let isProcessingDonation = false;

            // ==================== DOM REFERENCES ====================
            const els = {
                overlayRoot: document.getElementById('overlayRoot'),
                sideNotifStack: document.getElementById('sideNotifStack'),
                catHeadWrap: document.getElementById('catHeadWrap'),
                leftEyeGroup: document.getElementById('leftEyeGroup'),
                rightEyeGroup: document.getElementById('rightEyeGroup'),
                leftReelTrack: document.getElementById('leftReelTrack'),
                rightReelTrack: document.getElementById('rightReelTrack'),
                boardCard: document.getElementById('boardCard'),
                timerFitWrap: document.getElementById('timerFitWrap'),
                timerDisplay: document.getElementById('timerDisplay'),
                priceCells: Array.prototype.slice.call(document.querySelectorAll('.price-cell'))
            };

            // ==================== ZERO-OVERFLOW AUTO-FIT ENGINE ====================
            /**
             * Guarantees the main countdown digits NEVER overflow or wrap,
             * whether showing 02:00:00, 125:34:56, 1234:56:00, or 12345:00:00.
             * Uses binary search + exact safety decrement against available container width.
             */
            function fitTimerText() {
                const container = els.timerFitWrap;
                const textEl = els.timerDisplay;
                if (!container || !textEl) return;

                const containerWidth = container.clientWidth;
                if (!containerWidth || containerWidth <= 0) return;

                const availableWidth = Math.max(40, containerWidth - CONFIG.timerHorizontalMarginPx);
                const maxPx = CONFIG.timerMaxFontPx;
                const minPx = CONFIG.timerMinFontPx;

                // Fast path: check if max font size already fits comfortably
                textEl.style.fontSize = maxPx + 'px';
                if (textEl.scrollWidth <= availableWidth) {
                    return;
                }

                // Binary search for the largest font size (0.5px precision) that fits cleanly
                let low = minPx;
                let high = maxPx;
                let best = minPx;

                for (let i = 0; i < 12; i++) {
                    const mid = (low + high) / 2;
                    textEl.style.fontSize = mid.toFixed(2) + 'px';
                    if (textEl.scrollWidth <= availableWidth) {
                        best = mid;
                        low = mid;
                    } else {
                        high = mid;
                    }
                }

                // Floor to integer px for crisp font rasterization and zero subpixel overflow
                let finalPx = Math.max(minPx, Math.floor(best));
                textEl.style.fontSize = finalPx + 'px';

                while (finalPx > minPx && textEl.scrollWidth > availableWidth) {
                    finalPx = Math.max(minPx, finalPx - 1);
                    textEl.style.fontSize = finalPx + 'px';
                }
            }

            /**
             * Guarantees price table labels ("1 Sub", "100 TL", "100 Kicks", "+30 dk", etc.)
             * remain as large and crisp as possible with zero wrapping or clipping on any width.
             */
            function fitPriceCells() {
                let minAmountSize = 20;
                let minDurationSize = 23;

                els.priceCells.forEach(function (cell) {
                    const available = Math.max(30, cell.clientWidth - 6);
                    const amountEl = cell.querySelector('.price-amount');
                    const durationEl = cell.querySelector('.price-duration');

                    if (amountEl) {
                        let size = 20;
                        amountEl.style.fontSize = size + 'px';
                        while (size > 11 && amountEl.scrollWidth > available) {
                            size -= 1;
                            amountEl.style.fontSize = size + 'px';
                        }
                        if (size < minAmountSize) minAmountSize = size;
                    }

                    if (durationEl) {
                        let size = 23;
                        durationEl.style.fontSize = size + 'px';
                        while (size > 12 && durationEl.scrollWidth > available) {
                            size -= 1;
                            durationEl.style.fontSize = size + 'px';
                        }
                        if (size < minDurationSize) minDurationSize = size;
                    }
                });

                els.priceCells.forEach(function (cell) {
                    const amountEl = cell.querySelector('.price-amount');
                    const durationEl = cell.querySelector('.price-duration');
                    if (amountEl) amountEl.style.fontSize = minAmountSize + 'px';
                    if (durationEl) durationEl.style.fontSize = minDurationSize + 'px';
                });
            }

            function setupAutoFitObservers() {
                if (typeof window.ResizeObserver === 'function') {
                    try {
                        const ro = new window.ResizeObserver(function () {
                            fitTimerText();
                            fitPriceCells();
                        });
                        if (els.timerFitWrap) ro.observe(els.timerFitWrap);
                        if (els.boardCard) ro.observe(els.boardCard);
                    } catch (err) {
                        // Fall back to window resize listener below
                    }
                }

                window.addEventListener('resize', function () {
                    fitTimerText();
                    fitPriceCells();
                });

                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(function () {
                        fitTimerText();
                        fitPriceCells();
                    }).catch(function () { });
                }
            }

            // ==================== SAFE LOCALSTORAGE PERSISTENCE ====================
            function safeGetStorage(key) {
                try {
                    return window.localStorage.getItem(key);
                } catch (err) {
                    return null;
                }
            }

            function safeSetStorage(key, value) {
                try {
                    window.localStorage.setItem(key, value);
                } catch (err) {
                    // Silently continue in restricted OBS/iframe environments
                }
            }

            function safeRemoveStorage(key) {
                try {
                    window.localStorage.removeItem(key);
                } catch (err) {
                    // Ignore storage removal errors
                }
            }

            function getRemainingMs() {
                return Math.max(0, targetEndTimestamp - Date.now());
            }

            function saveTimerState() {
                safeSetStorage(CONFIG.storageKey, JSON.stringify({
                    targetEndTimestamp: targetEndTimestamp,
                    remainingMs: getRemainingMs(),
                    urlMinutes: activeUrlMinutes,
                    savedAt: Date.now()
                }));
            }

            function loadSavedState() {
                const raw = safeGetStorage(CONFIG.storageKey);
                if (!raw) return null;
                try {
                    const parsed = JSON.parse(raw);
                    if (!parsed || typeof parsed !== 'object') return null;
                    const savedUrlMinutes = Number.isFinite(parsed.urlMinutes) ? parsed.urlMinutes : null;
                    if (Number.isFinite(parsed.targetEndTimestamp)) {
                        return {
                            remainingMs: Math.max(0, parsed.targetEndTimestamp - Date.now()),
                            urlMinutes: savedUrlMinutes
                        };
                    }
                    if (Number.isFinite(parsed.remainingMs)) {
                        return {
                            remainingMs: Math.max(0, parsed.remainingMs),
                            urlMinutes: savedUrlMinutes
                        };
                    }
                } catch (err) {
                    return null;
                }
                return null;
            }

            // ==================== ROBUST NUMBER PARSING & TIME FORMATTING ====================
            /**
             * Parses numeric amounts from numbers or formatted strings such as:
             * "1,000.00", "₺130,00", "1.250,50", "130 TRY".
             */
            function parseNumericAmount(value) {
                if (typeof value === 'number') {
                    return Number.isFinite(value) ? value : NaN;
                }
                if (typeof value !== 'string') return NaN;

                const cleaned = value.trim().replace(/[^\d.,-]/g, '');
                if (!cleaned) return NaN;

                const lastComma = cleaned.lastIndexOf(',');
                const lastDot = cleaned.lastIndexOf('.');
                let normalized = cleaned;

                if (lastComma > -1 && lastDot > -1) {
                    if (lastComma > lastDot) {
                        normalized = cleaned.replace(/\./g, '').replace(',', '.');
                    } else {
                        normalized = cleaned.replace(/,/g, '');
                    }
                } else if (lastComma > -1) {
                    const decimals = cleaned.length - lastComma - 1;
                    normalized = decimals === 3 ? cleaned.replace(/,/g, '') : cleaned.replace(',', '.');
                }

                const num = parseFloat(normalized);
                return Number.isFinite(num) ? num : NaN;
            }

            function formatClock(totalSeconds) {
                const clamped = Math.max(0, Math.floor(totalSeconds));
                const hrs = Math.floor(clamped / 3600);
                const mins = Math.floor((clamped % 3600) / 60);
                const secs = clamped % 60;
                return (
                    String(hrs).padStart(2, '0') + ':' +
                    String(mins).padStart(2, '0') + ':' +
                    String(secs).padStart(2, '0')
                );
            }

            /**
             * Formats base added duration for the side notification pill:
             * e.g., 300 -> "+05:00", 1170 -> "+19:30", 3600 -> "+1:00:00", 360000 -> "+100:00:00"
             */
            function formatSideDuration(totalSeconds) {
                const sec = Math.max(0, Math.round(totalSeconds));
                const hrs = Math.floor(sec / 3600);
                const mins = Math.floor((sec % 3600) / 60);
                const remSecs = sec % 60;
                if (hrs > 0) {
                    return '+' + hrs + ':' + String(mins).padStart(2, '0') + ':' + String(remSecs).padStart(2, '0');
                }
                return '+' + String(mins).padStart(2, '0') + ':' + String(remSecs).padStart(2, '0');
            }

            // ==================== TIMER RENDER & SIDE NOTIFICATION ====================
            function renderTimer(force) {
                const remainingSeconds = Math.ceil(getRemainingMs() / 1000);
                if (!force && remainingSeconds === lastRenderedSecond) return;

                lastRenderedSecond = remainingSeconds;
                const formatted = formatClock(remainingSeconds);
                els.timerDisplay.textContent = formatted;

                if (force || formatted.length !== lastFormattedLength) {
                    lastFormattedLength = formatted.length;
                    fitTimerText();
                }
            }

            function sanitizeText(value, maxLen) {
                if (value == null) return '';
                const cleaned = String(value).replace(/\s+/g, ' ').trim();
                if (!cleaned) return '';
                if (maxLen && cleaned.length > maxLen) {
                    return cleaned.slice(0, maxLen - 1).trimEnd() + '…';
                }
                return cleaned;
            }

            function formatDonationAmount(currencyType, amount) {
                const isWhole = Math.abs(amount - Math.round(amount)) < 1e-6;
                const numText = isWhole
                    ? String(Math.round(amount))
                    : amount.toFixed(2).replace('.', ',');
                if (currencyType === 'TRY') return numText + ' TL';
                if (currencyType === 'KICKS') return numText + ' Kicks';
                if (currencyType === 'SUB') return numText + ' Sub';
                return numText;
            }

            function sleep(ms) {
                return new Promise(function (resolve) {
                    setTimeout(resolve, ms);
                });
            }

            function computeNotifHoldMs(donorName, messageText) {
                const msgLen = messageText ? messageText.length : 0;
                const donorWeight = donorName ? Math.round(donorName.length * 0.4) : 0;
                const rawMs = CONFIG.notifBaseHoldMs + (msgLen + donorWeight) * CONFIG.notifMsPerChar;
                return Math.max(CONFIG.notifMinHoldMs, Math.min(CONFIG.notifMaxHoldMs, rawMs));
            }

            /**
             * Builds a donate banner DOM element emerging from behind the cat head toward the left
             * and calculates its dynamic reading hold duration (clamped to min/max bounds).
             */
            function createSideNotificationElement(baseSeconds, bonusSeconds, tier, details) {
                const info = details && typeof details === 'object' ? details : {};
                const donorName = sanitizeText(info.donorName, 40);
                const messageText = sanitizeText(info.message, 280);
                const amountLabel = sanitizeText(info.amountLabel, 32);

                const pill = document.createElement('div');
                pill.className = 'side-notif tier-' + tier;

                const bodyEl = document.createElement('div');
                bodyEl.className = 'notif-body';

                if (donorName || amountLabel) {
                    const metaEl = document.createElement('div');
                    metaEl.className = 'notif-meta';

                    if (donorName) {
                        const donorEl = document.createElement('span');
                        donorEl.className = 'notif-donor';
                        donorEl.textContent = donorName;
                        metaEl.appendChild(donorEl);
                    }

                    if (donorName && amountLabel) {
                        const dotEl = document.createElement('span');
                        dotEl.className = 'notif-dot';
                        dotEl.textContent = '•';
                        metaEl.appendChild(dotEl);
                    }

                    if (amountLabel) {
                        const amountEl = document.createElement('span');
                        amountEl.className = 'notif-amount';
                        amountEl.textContent = amountLabel;
                        metaEl.appendChild(amountEl);
                    }

                    bodyEl.appendChild(metaEl);
                }

                if (messageText) {
                    const msgEl = document.createElement('div');
                    msgEl.className = 'notif-message';
                    msgEl.textContent = messageText;
                    bodyEl.appendChild(msgEl);
                }

                if (bodyEl.childNodes.length > 0) {
                    pill.appendChild(bodyEl);
                }

                const timeWrap = document.createElement('div');
                timeWrap.className = 'notif-time-wrap';

                const durationText = formatSideDuration(baseSeconds);
                const durationSpan = document.createElement('span');
                durationSpan.className = 'notif-duration' + (durationText.length >= 9 ? ' is-long' : '');
                durationSpan.textContent = durationText;
                timeWrap.appendChild(durationSpan);

                if (bonusSeconds > 0) {
                    const badge = document.createElement('span');
                    badge.className = 'bonus-badge';
                    badge.textContent = '+' + bonusSeconds + ' sn';
                    timeWrap.appendChild(badge);
                }

                pill.appendChild(timeWrap);

                return {
                    el: pill,
                    holdMs: computeNotifHoldMs(donorName, messageText)
                };
            }

            function pulseBoard() {
                els.boardCard.classList.remove('pulse-add');
                void els.boardCard.offsetWidth;
                els.boardCard.classList.add('pulse-add');
                setTimeout(function () {
                    els.boardCard.classList.remove('pulse-add');
                }, 860);
            }

            function triggerEyeBounce(eyeGroupEl) {
                eyeGroupEl.classList.remove('pop-lock');
                void eyeGroupEl.getBoundingClientRect();
                eyeGroupEl.classList.add('pop-lock');
                setTimeout(function () {
                    eyeGroupEl.classList.remove('pop-lock');
                }, 380);
            }

            // ==================== SLOT MACHINE EYE REEL ENGINE ====================
            function getIconHref(tier) {
                if (tier === 'gold') return '#iconGold';
                if (tier === 'dollar') return '#iconDollar';
                return '#iconLatte';
            }

            function populateReel(trackEl, finalTier, totalSteps) {
                while (trackEl.firstChild) {
                    trackEl.removeChild(trackEl.firstChild);
                }
                const pool = ['#iconLatte', '#iconDollar', '#iconGold', '#iconSparkle'];
                const finalHref = getIconHref(finalTier);

                for (let i = 0; i <= totalSteps; i++) {
                    const href = i === totalSteps ? finalHref : pool[i % pool.length];
                    const useEl = document.createElementNS(SVG_NS, 'use');
                    useEl.setAttribute('href', href);
                    useEl.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', href);
                    useEl.setAttribute('x', '0');
                    useEl.setAttribute('y', String(i * EYE_STEP_PX));
                    trackEl.appendChild(useEl);
                }
            }

            function animateSingleReel(trackEl, eyeCenter, totalSteps, durationMs) {
                return new Promise(function (resolve) {
                    const startY = eyeCenter.y;
                    const endY = eyeCenter.y - totalSteps * EYE_STEP_PX;
                    const distance = endY - startY;
                    const startTime = performance.now();

                    trackEl.setAttribute('filter', 'url(#slotMotionBlur)');

                    function frame(now) {
                        const elapsed = now - startTime;
                        const t = Math.min(1, elapsed / durationMs);
                        const eased = 1 - Math.pow(1 - t, 4.2);
                        const currentY = startY + distance * eased;

                        trackEl.setAttribute('transform', 'translate(' + eyeCenter.x + ', ' + currentY.toFixed(2) + ')');

                        if (t > 0.78 && trackEl.hasAttribute('filter')) {
                            trackEl.removeAttribute('filter');
                        }

                        if (t < 1) {
                            requestAnimationFrame(frame);
                        } else {
                            trackEl.removeAttribute('filter');
                            trackEl.setAttribute('transform', 'translate(' + eyeCenter.x + ', ' + endY + ')');
                            resolve();
                        }
                    }

                    requestAnimationFrame(frame);
                });
            }

            function clearEyeTierClasses() {
                els.catHeadWrap.classList.remove('glow-latte', 'glow-dollar', 'glow-gold');
                els.leftEyeGroup.classList.remove('tier-latte', 'tier-dollar', 'tier-gold');
                els.rightEyeGroup.classList.remove('tier-latte', 'tier-dollar', 'tier-gold');
            }

            async function spinSlotEyes(tier) {
                clearEyeTierClasses();
                els.overlayRoot.classList.add('is-excited');
                els.leftEyeGroup.classList.add('slot-active');
                els.rightEyeGroup.classList.add('slot-active');

                const leftSteps = 12;
                const rightSteps = 15;
                populateReel(els.leftReelTrack, tier, leftSteps);
                populateReel(els.rightReelTrack, tier, rightSteps);

                // Staggered lock-in: left eye settles, then right eye ~260ms later
                const leftSpin = animateSingleReel(els.leftReelTrack, LEFT_EYE_CENTER, leftSteps, 1020);
                const rightSpin = animateSingleReel(els.rightReelTrack, RIGHT_EYE_CENTER, rightSteps, 1280);

                await leftSpin;
                els.leftEyeGroup.classList.add('tier-' + tier);
                triggerEyeBounce(els.leftEyeGroup);

                await rightSpin;
                els.rightEyeGroup.classList.add('tier-' + tier);
                els.catHeadWrap.classList.add('glow-' + tier);
                triggerEyeBounce(els.rightEyeGroup);
            }

            function resetSlotEyes() {
                els.leftEyeGroup.classList.remove('slot-active');
                els.rightEyeGroup.classList.remove('slot-active');
                clearEyeTierClasses();
                els.overlayRoot.classList.remove('is-excited');
            }

            // ==================== UNIFIED SEQUENTIAL DONATION QUEUE & +13 SN BONUS RULE ====================
            function isPositiveMultipleOf13(amount) {
                if (!Number.isFinite(amount) || amount <= 0) return false;
                const rounded = Math.round(amount);
                return (
                    Number.isInteger(rounded) &&
                    rounded > 0 &&
                    Math.abs(amount - rounded) < 1e-6 &&
                    rounded % CONFIG.bonusMultiple === 0
                );
            }

            /**
             * Runs queued donations strictly one at a time:
             * - While one donation is displayed, queued donations do NOT appear on screen
             *   and do NOT add time to the countdown until it is their turn.
             * - Hold duration scales dynamically with text length (clamped to min/max limits).
             * - Banner exits smoothly sliding to the right behind the cat before the next item begins.
             */
            async function processDonationQueue() {
                if (isProcessingDonation) return;
                isProcessingDonation = true;

                try {
                    while (donationQueue.length > 0) {
                        const item = donationQueue.shift();

                        // 1. Add time to drift-free countdown ONLY when this donation activates
                        const now = Date.now();
                        const baseEnd = targetEndTimestamp > now ? targetEndTimestamp : now;
                        targetEndTimestamp = baseEnd + item.totalAddedSeconds * 1000;
                        saveTimerState();
                        renderTimer(true);
                        pulseBoard();

                        // 2. Spin cat slot eyes + mount single banner emerging from behind the cat
                        const eyeSpinPromise = spinSlotEyes(item.tier);
                        const banner = createSideNotificationElement(
                            item.baseSeconds,
                            item.bonusSeconds,
                            item.tier,
                            item.details
                        );

                        while (els.sideNotifStack.firstChild) {
                            els.sideNotifStack.removeChild(els.sideNotifStack.firstChild);
                        }
                        els.sideNotifStack.appendChild(banner.el);

                        // Force reflow so smooth slide-out transition starts from behind the cat
                        void banner.el.offsetWidth;
                        banner.el.classList.add('is-visible');

                        // Hold on screen based on text length (and ensure slot eyes finished settling)
                        await Promise.all([
                            eyeSpinPromise,
                            sleep(CONFIG.notifEnterMs + banner.holdMs)
                        ]);

                        // 3. Slowly & fluidly glide right back behind the cat
                        banner.el.classList.remove('is-visible');
                        banner.el.classList.add('is-exiting');
                        await sleep(CONFIG.notifExitMs + 60);

                        if (banner.el.parentNode) {
                            banner.el.parentNode.removeChild(banner.el);
                        }

                        resetSlotEyes();

                        if (donationQueue.length > 0) {
                            await sleep(CONFIG.notifQueueGapMs);
                        }
                    }
                } finally {
                    resetSlotEyes();
                    isProcessingDonation = false;
                }
            }

            /**
             * Validates and enqueues a donation in TRY, KICKS, or SUB.
             * Timer increment, banner display, and slot eyes all execute sequentially per queued item.
             */
            function processDonation(currencyType, rawAmount, details) {
                const type = String(currencyType || '').toUpperCase();
                const amount = parseNumericAmount(rawAmount);
                if (!Number.isFinite(amount) || amount <= 0) return;

                const secPerUnit = CONFIG.secondsPerUnit[type];
                if (!Number.isFinite(secPerUnit) || secPerUnit <= 0) return;

                const baseSeconds = Math.round(amount * secPerUnit);
                const bonusSeconds = isPositiveMultipleOf13(amount) ? CONFIG.bonusSeconds : 0;
                const totalAddedSeconds = baseSeconds + bonusSeconds;

                if (totalAddedSeconds <= 0) return;

                // Prize eye tier based on total added duration
                let tier = 'latte';
                if (totalAddedSeconds >= 3600) {
                    tier = 'gold';
                } else if (totalAddedSeconds >= 600) {
                    tier = 'dollar';
                }

                const info = details && typeof details === 'object' ? details : {};
                const notifDetails = {
                    donorName: info.donorName || '',
                    message: info.message || '',
                    amountLabel: info.amountLabel || formatDonationAmount(type, amount)
                };

                donationQueue.push({
                    baseSeconds: baseSeconds,
                    bonusSeconds: bonusSeconds,
                    totalAddedSeconds: totalAddedSeconds,
                    tier: tier,
                    details: notifDetails
                });

                processDonationQueue();
            }

            function resetTimerToDefault() {
                const resetMinutes = Number.isFinite(activeUrlMinutes) ? activeUrlMinutes : CONFIG.initialMinutes;
                safeRemoveStorage(CONFIG.storageKey);
                targetEndTimestamp = Date.now() + Math.round(resetMinutes * 60 * 1000);
                saveTimerState();
                renderTimer(true);
                pulseBoard();
            }

            // ==================== STREAMLABS SOCKET & PAYLOAD PARSER ====================
            function isDuplicateEvent(eventId) {
                if (!eventId) return false;
                const key = String(eventId);
                if (seenEventIds.has(key)) return true;
                seenEventIds.add(key);
                if (seenEventIds.size > CONFIG.maxSeenEvents) {
                    const oldest = seenEventIds.values().next().value;
                    seenEventIds.delete(oldest);
                }
                return false;
            }

            function handleStreamlabsPayload(eventData) {
                if (!eventData || typeof eventData !== 'object') return;
                const type = String(eventData.type || '').toLowerCase();
                const messages = Array.isArray(eventData.message)
                    ? eventData.message
                    : (eventData.message ? [eventData.message] : []);

                messages.forEach(function (msg) {
                    if (!msg || typeof msg !== 'object') return;

                    const eventId = msg._id || msg.id || msg.event_id || eventData.event_id;
                    if (isDuplicateEvent(eventId)) return;

                    const msgCurrency = String(msg.currency || '').trim().toUpperCase();
                    const donorName = sanitizeText(
                        msg.from || msg.name || msg.display_name || msg.username || msg.sender || msg.gifter || '',
                        40
                    );
                    const donorMessage = sanitizeText(
                        msg.message || msg.comment || msg.text || msg.note || '',
                        280
                    );

                    // 1. Kicks / Bits / Kick gift payloads
                    if (
                        type === 'bits' ||
                        type === 'kicks' ||
                        type === 'kick_kicks' ||
                        type === 'kick' ||
                        type === 'kick_gift' ||
                        msgCurrency === 'KICKS'
                    ) {
                        const kicksAmount = parseNumericAmount(
                            msg.amount != null ? msg.amount :
                                (msg.kicks != null ? msg.kicks :
                                    (msg.bits != null ? msg.bits :
                                        (msg.quantity != null ? msg.quantity : msg.count)))
                        );
                        if (Number.isFinite(kicksAmount) && kicksAmount > 0) {
                            processDonation('KICKS', kicksAmount, {
                                donorName: donorName,
                                message: donorMessage
                            });
                        }
                        return;
                    }

                    // 2. Monetary Donations / Tips (TRY / TL)
                    if (type === 'donation' || type === 'tip') {
                        if (!msgCurrency || msgCurrency === 'TRY' || msgCurrency === 'TL') {
                            const amount = parseNumericAmount(msg.amount != null ? msg.amount : msg.formatted_amount);
                            if (Number.isFinite(amount) && amount > 0) {
                                processDonation('TRY', amount, {
                                    donorName: donorName,
                                    message: donorMessage
                                });
                            }
                        }
                        return;
                    }

                    // 3. Subscriptions / Resubs / Mystery Gift Subs / Kick Subscriptions
                    if (
                        type === 'subscription' ||
                        type === 'resub' ||
                        type === 'sub' ||
                        type === 'submysterygift' ||
                        type === 'gift_sub' ||
                        type === 'gift_subscription' ||
                        type === 'kick_sub' ||
                        type === 'kick_subscription' ||
                        type === 'gift'
                    ) {
                        const rawCount =
                            msg.quantity != null ? msg.quantity :
                                (msg.sub_count != null ? msg.sub_count :
                                    (msg.gift_count != null ? msg.gift_count :
                                        (msg.mass_gift_count != null ? msg.mass_gift_count :
                                            (msg.count != null ? msg.count : 1))));
                        const subCount = parseNumericAmount(rawCount);
                        processDonation('SUB', Number.isFinite(subCount) && subCount > 0 ? subCount : 1, {
                            donorName: donorName,
                            message: donorMessage
                        });
                    }
                });
            }

            // Exposed for easy console / automated Streamlabs payload testing
            window.handleStreamlabsPayload = handleStreamlabsPayload;
            window.handleStreamlabsEvent = handleStreamlabsPayload;

            // Dynamically load Socket.IO v2.5.0 ONLY when a Streamlabs token is present
            function connectStreamlabs(token) {
                if (!token || typeof token !== 'string') return;
                const cleanToken = token.trim();
                if (!cleanToken) return;

                function initSocket() {
                    if (typeof window.io !== 'function') return;
                    try {
                        if (streamlabsSocket) {
                            streamlabsSocket.disconnect();
                        }
                        streamlabsSocket = window.io('https://sockets.streamlabs.com?token=' + encodeURIComponent(cleanToken), {
                            transports: ['websocket']
                        });
                        streamlabsSocket.on('event', handleStreamlabsPayload);
                    } catch (err) {
                        // Socket failures never disrupt the countdown display
                    }
                }

                if (typeof window.io === 'function') {
                    initSocket();
                    return;
                }

                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.js';
                script.async = true;
                script.onload = initSocket;
                document.head.appendChild(script);
            }

            // ==================== HIDDEN KEYBOARD TEST SHORTCUTS (1 - 6, R) ====================
            window.addEventListener('pointerdown', function () {
                if (document.body && typeof document.body.focus === 'function') {
                    document.body.focus();
                }
            });

            window.addEventListener('keydown', function (e) {
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                const key = e.key;
                if (key === '1') {
                    processDonation('KICKS', 100, {
                        donorName: 'Mırmır',
                        message: 'Kediye mama parası, iyi yayınlar!'
                    });  // +05:00 -> Latte eyes
                } else if (key === '2') {
                    processDonation('TRY', 100, {
                        donorName: 'Ahmet',
                        message: 'Paithon efsane gidiyor, kolay gelsin!'
                    });  // +15:00 -> Dollar eyes
                } else if (key === '3') {
                    processDonation('SUB', 2, {
                        donorName: 'LilaKedi',
                        message: '2 abonelik geldi, yayın devamkee!'
                    });  // +1:00:00 -> Gold eyes
                } else if (key === '4') {
                    processDonation('TRY', 130, {
                        donorName: 'PairaFan',
                        message: '13 ün katı bonuslu bağış! Kedi çok tatlı olmuş 💜'
                    });  // +19:30 + "+13 sn" badge -> Dollar eyes
                } else if (key === '5') {
                    processDonation('KICKS', 130, {
                        donorName: 'PatiSever',
                        message: 'Bonus saniyeler de benden olsun!'
                    });  // +06:30 + "+13 sn" badge -> Latte eyes
                } else if (key === '6') {
                    processDonation('SUB', 200, {
                        donorName: 'MegaDestek',
                        message: 'Bu yayın bugün bitmez, 100 saat daha!'
                    });  // +100:00:00 -> Gold eyes (tests 3-4+ digit auto-fit)
                } else if (key === 'r' || key === 'R') {
                    resetTimerToDefault();          // Reset to default / URL minutes
                }
            });

            // ==================== INITIALIZATION ====================
            function startCountdownLoop() {
                function tick() {
                    renderTimer(false);
                    requestAnimationFrame(tick);
                }
                requestAnimationFrame(tick);
            }

            function init() {
                const params = new URLSearchParams(window.location.search);
                const urlToken = params.get('token');
                const urlMinutes = parseFloat(params.get('minutes'));
                const hasUrlMinutes = Number.isFinite(urlMinutes) && urlMinutes >= 0;
                const shouldReset = params.get('reset') === '1' || params.get('reset') === 'true';

                if (shouldReset) {
                    safeRemoveStorage(CONFIG.storageKey);
                }

                const savedState = shouldReset ? null : loadSavedState();
                const urlMinutesChanged = hasUrlMinutes && (!savedState || savedState.urlMinutes !== urlMinutes);

                if (hasUrlMinutes && (shouldReset || !savedState || urlMinutesChanged)) {
                    activeUrlMinutes = urlMinutes;
                    targetEndTimestamp = Date.now() + Math.round(urlMinutes * 60 * 1000);
                } else if (savedState) {
                    activeUrlMinutes = savedState.urlMinutes;
                    targetEndTimestamp = Date.now() + savedState.remainingMs;
                } else {
                    activeUrlMinutes = null;
                    targetEndTimestamp = Date.now() + Math.round(CONFIG.initialMinutes * 60 * 1000);
                }

                saveTimerState();
                setupAutoFitObservers();
                renderTimer(true);
                fitPriceCells();
                startCountdownLoop();

                const token = urlToken || CONFIG.streamlabsToken;
                if (token) {
                    connectStreamlabs(token);
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
