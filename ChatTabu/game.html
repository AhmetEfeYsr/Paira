<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Paira ChatTabu | Twitch ve Kick İçin İnteraktif Tabu Oyunu</title>

    <script src="../shared/shared.js?v=2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../shared/shared.css?v=2.0.0">
    <link rel="stylesheet" href="style.css?v=2.0.0">

    <!-- Favicons -->
    <link rel="icon" type="image/avif" href="https://pairaaa.com/main_logo.avif">
    <link rel="apple-touch-icon" href="https://pairaaa.com/main_logo.avif">

    <meta property="og:image" content="https://pairaaa.com/main_logo.avif">
    <meta property="twitter:image" content="https://pairaaa.com/main_logo.avif">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <!-- LOBBY SCREEN -->
    <main id="app-container" class="glass-panel custom-scrollbar">
        <section id="lobby-screen" class="view-state active">
            <div class="lobby-header" style="justify-content: space-between; align-items: center; display: flex; flex-wrap: wrap; gap: 12px;">
                <h2 style="margin: 0;">Lobi Bekleme Odası</h2>
                <div class="code-container" id="room-code-display" style="display: none; align-items: center; gap: 10px;">
                    <span style="color: var(--text-muted); font-weight: 500;">Oda Kodu:</span>
                    <span id="display-room-code" data-code="" style="color: var(--neon-purple); letter-spacing: 4px; font-family: monospace; font-size: 1.35rem; user-select: none; font-weight: bold; min-width: 120px; text-align: center;">••••••••</span>
                    <button id="btn-toggle-code" class="btn btn-icon toggle-btn" title="Göster/Gizle" style="padding: 8px; display: flex; align-items: center; justify-content: center;">
                        <svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg id="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                    <button id="btn-copy-room" class="btn btn-secondary" style="display: flex; gap: 6px; align-items: center; padding: 8px 12px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Kopyala
                    </button>
                </div>
            </div>

            <div class="lobby-grid">
                <!-- Sol Taraf (Ayarlar) -->
                <div class="card settings-card" id="settings-card" style="display: none; padding: 1.2rem;">
                    <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--btn-secondary-border); padding-bottom: 0.5rem;">Oyun Ayarları <span style="font-size: 0.8rem; color: var(--text-muted);">(Sadece Kurucu)</span></h3>

                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 0.4rem;">Sohbet Tahmin Kuralları</label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.9rem; background: var(--input-bg); padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--btn-secondary-border);">
                            <input type="checkbox" id="setting-allow-any-chat" checked style="width: 18px; height: 18px; accent-color: var(--primary-purple);">
                            <span>Tüm Bağlı Sohbetler Tahmin Edebilsin (Çapraz Chat)</span>
                        </label>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 0.3rem;">Tur Süresi (sn)</label>
                            <input type="number" id="setting-turn-duration" value="60" min="30" max="180" style="padding: 0.5rem; font-size: 0.95rem;">
                        </div>
                        <div class="form-group">
                            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 0.3rem;">Toplam Tur Sayısı</label>
                            <input type="number" id="setting-max-rounds" value="5" min="1" max="15" style="padding: 0.5rem; font-size: 0.95rem;">
                        </div>
                    </div>

                    <div style="flex-grow: 1;"></div>
                    <button id="btn-start-game" class="btn btn-primary btn-block" style="padding: 12px; margin-top: 1rem; font-weight: 700;">Oyunu Başlat</button>
                </div>

                <!-- Sağ Taraf (Oyuncular) -->
                <div class="card players-card">
                    <h3 style="margin-bottom: 0;">Yayıncılar (<span id="player-count-display">1</span>)</h3>
                    <div class="players-panel">
                        <ul id="players-list" class="custom-scrollbar">
                            <!-- Players -->
                        </ul>
                    </div>
                    <div id="lobby-status" style="margin-top: auto; font-size: 0.9rem; color: var(--text-muted); text-align: center;">Bekleniyor...</div>
                </div>
            </div>

            <button class="btn btn-secondary" id="btn-leave-lobby" style="margin-top: 1.5rem; max-width: 200px; align-self: center;">Odadan Çık</button>
        </section>

        <!-- GAME SCREEN -->
        <section id="game-screen" class="view-state">
            <div class="game-topbar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div id="active-turn-indicator" style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: var(--text-main);">
                    <!-- Active narrator info -->
                </div>

                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <button class="btn btn-secondary btn-icon" id="btn-leave-game" title="Çıkış Yap">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </div>

            <div class="chat-tabu-layout">
                <!-- Sol Taraf: Liderlik Tablosu -->
                <div class="sidebar sidebar-left">
                    <div class="sidebar-header" style="font-size: 1.1rem; text-align: center;">Liderlik Tablosu</div>
                    <div class="leaderboard-list custom-scrollbar" id="leaderboard-list">
                        <!-- Scores -->
                    </div>
                </div>

                <!-- Orta: Oyun Alanı (Streamer View) -->
                <div class="game-area">
                    <div id="round-display" style="display:none; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 5px; font-weight: bold;">Tur: 1/5</div>
                    <div id="turn-timer" class="timer" style="display:none; margin-bottom: 5px;">60</div>
                    <div class="status-badge" id="turn-status">Bekleniyor...</div>

                    <div class="card-tabu taboo-card">
                        <div class="card-header" style="position: relative; display: flex; justify-content: center; align-items: center;">
                            <h2 class="main-word" id="main-word">Hazırlanıyor...</h2>
                            <button id="btn-toggle-visibility" class="btn btn-icon" title="Kelimeyi Gizle/Göster" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: var(--btn-secondary-bg); border: 1px solid var(--btn-secondary-border); color: var(--text-main); border-radius: 8px; padding: 6px; cursor: pointer; display: none;">
                                <svg id="word-eye-open" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                <svg id="word-eye-closed" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                        <ul class="forbidden-words-list custom-scrollbar" id="forbidden-words">
                            <li>Lütfen</li>
                            <li>Bekleyiniz</li>
                        </ul>
                    </div>

                    <div class="controls narrator-actions">
                        <button class="btn btn-warning" id="btn-taboo" style="display: none;">Tabu Yaptı</button>
                        <button class="btn btn-danger" id="btn-skip">Pas Geç</button>
                    </div>
                </div>

                <!-- Sağ Taraf: Sohbet Akışı -->
                <div class="sidebar sidebar-right">
                    <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>Sohbet (<span id="channel-name-display"></span>)</span>
                        <span id="chat-status" style="font-size: 0.8rem; color: var(--success);">• Bağlı</span>
                    </div>
                    <div class="chat-feed custom-scrollbar" id="chat-feed">
                        <!-- Messages will appear here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../shared/chat.js?v=2.0.0"></script>
    <script src="network.js?v=2.0.0"></script>
    <script src="game.js?v=2.0.0"></script>
</body>
</html>
